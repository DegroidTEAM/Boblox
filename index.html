let ac=null, mOn=false, mInt=null, mStep=0;
function toggleMusic() {
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();

    mOn = !mOn;
    mbtn.innerHTML = mOn ? "🔊" : "🔇";

}
function musicTick() { if(!mOn || !ac) return; pNoise(0.05, 0.03); let s = mStep % 8; if(s===0 || s===4) pNote(60, 0.15, 'sine', 0.3); if(s===2 || s===6) pNoise(0.1, 0.1); pNote([262,330,392,523,494,392,330,262][s], 0.2, 'square', 0.08); if(s%2===0) pNote([131,165,196,262][s/2], 0.3, 'triangle', 0.06); mStep++; }
function pNote(freq, duration, type='square', volume=0.1) { if(!ac || !mOn) return; let osc = ac.createOscillator(), gain = ac.createGain(); osc.type = type; osc.frequency.value = freq; gain.gain.setValueAtTime(volume, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+duration); osc.connect(gain); gain.connect(ac.destination); osc.start(); osc.stop(ac.currentTime+duration); }
function pNoise(duration, volume=0.05) { if(!ac || !mOn) return; const bs = ac.sampleRate * duration, b = ac.createBuffer(1, bs, ac.sampleRate), dt = b.getChannelData(0); for(let i=0; i<bs; i++) dt[i] = Math.random()*2-1; const n = ac.createBufferSource(); n.buffer = b; const f = ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1000; const g = ac.createGain(); g.gain.setValueAtTime(volume, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+duration); n.connect(f); f.connect(g); g.connect(ac.destination); n.start(); n.stop(ac.currentTime+duration); }
