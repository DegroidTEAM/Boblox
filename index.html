<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Роблокс Мини Игры</title>
    <!-- Подключаем библиотеку для онлайн-игры -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', 'Arial', sans-serif; user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        #menu { background: radial-gradient(circle at top, #4a00e0, #8e2de2, #00c6ff); justify-content: flex-start; overflow-y: auto; }
        .title { color: white; font-size: 38px; font-weight: 900; margin-top: 20px; margin-bottom: 20px; text-transform: uppercase; text-shadow: 3px 3px 0px rgba(0,0,0,0.4); animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; padding-bottom: 40px; }
        .game-btn { background: white; border: none; border-radius: 20px; padding: 15px; text-align: left; box-shadow: 0 6px 0 rgba(0,0,0,0.3); transition: transform 0.1s; display: flex; align-items: center; }
        .game-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .btn-icon { font-size: 40px; margin-right: 15px; }
        .btn-text { color: #2c3e50; font-weight: 800; font-size: 18px; }
        .mp-btn { background: #ffd700; color: #2c3e50; margin-bottom: 20px; }

        #mpLobby { background: linear-gradient(180deg, #0f0c29, #302b63, #24243e); }
        #mpLobby h1 { color: white; font-size: 32px; margin-bottom: 30px; }
        .mp-card { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 300px; margin-bottom: 20px; }
        .mp-card h2 { margin-bottom: 20px; color: #333; }
        .mp-input { font-size: 30px; text-align: center; letter-spacing: 10px; width: 100%; padding: 10px; border: 3px solid #8e2de2; border-radius: 10px; margin-bottom: 15px; }
        .mp-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .mp-key { background: #ecf0f1; border: none; padding: 15px; font-size: 20px; border-radius: 10px; font-weight: bold; }
        .mp-key:active { background: #bdc3c7; }
        .action-btn { background: #8e2de2; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 15px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 0 #6a1b9a; }
        .back-btn { background: transparent; color: white; border: 2px solid white; margin-top: 20px; padding: 10px 20px; border-radius: 15px; }
        #roomCodeDisplay { font-size: 50px; font-weight: 900; color: #8e2de2; margin: 20px 0; letter-spacing: 5px; }
        #mpStatus { color: white; margin-top: 10px; font-size: 16px; }

        #musicBtn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; z-index: 15; display: flex; align-items: center; justify-content: center; }
        #exitBtn { position: absolute; top: 15px; right: 15px; background: rgba(231, 76, 60,0.9); color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-size: 22px; z-index: 5; display: none; align-items: center; justify-content: center; }

        #msgBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; color: #2c3e50; padding: 30px 40px; border-radius: 25px; text-align: center; z-index: 20; display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 4px solid #8e2de2; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 85%; max-width: 320px; }
        #msgBox.show { transform: translate(-50%, -50%) scale(1); }
        #msgBox h1 { font-size: 28px; margin-bottom: 20px; font-weight: 900; }
        #msgBox button { background: #8e2de2; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #6a1b9a; }
    </style>
</head>
<body>

    <button id="musicBtn" onclick="toggleMusic()">🎵</button>
    
    <div id="menu" class="screen">
        <div class="title">🎮 ИГРЫ</div>
        <button class="game-btn mp-btn" onclick="unlockMedia(); showLobby()">
            <div class="btn-icon">👥</div><div class="btn-text">ИГРАТЬ С ДРУГОМ</div>
        </button>
        <div class="btn-container">
            <button class="game-btn" onclick="startGame(1)"><div class="btn-icon">🏠</div><div class="btn-text">Дом от Хагги</div></button>
            <button class="game-btn" onclick="startGame(2)"><div class="btn-icon">🏃</div><div class="btn-text">Убеги от монстра</div></button>
            <button class="game-btn" onclick="startGame(3)"><div class="btn-icon">🙈</div><div class="btn-text">Прятки Хагги</div></button>
            <button class="game-btn" onclick="startGame(4)"><div class="btn-icon">🏥</div><div class="btn-text">Больница Животных</div></button>
            <button class="game-btn" onclick="startGame(5)"><div class="btn-icon">🍔🚽</div><div class="btn-text">Вкусно или Туалет</div></button>
        </div>
    </div>

    <div id="mpLobby" class="screen hidden">
        <h1>👥 ИГРА ВМЕСТЕ</h1>
        
        <div id="mpChoice">
            <button class="game-btn" style="margin-bottom:15px;" onclick="hostGame()">
                <div class="btn-icon">📱</div><div class="btn-text">СОЗДАТЬ ИГРУ</div>
            </button>
            <button class="game-btn" onclick="document.getElementById('joinForm').classList.remove('hidden'); document.getElementById('mpChoice').classList.add('hidden');">
                <div class="btn-icon">⌨️</div><div class="btn-text">ВОЙТИ К ДРУГУ</div>
            </button>
        </div>

        <div id="hostForm" class="hidden">
            <div class="mp-card">
                <h2>Твой код:</h2>
                <div id="roomCodeDisplay">....</div>
                <p id="mpStatus">Подключение к сети...</p>
            </div>
        </div>

        <div id="joinForm" class="hidden">
            <div class="mp-card">
                <h2>Введи код друга:</h2>
                <input type="text" id="codeInput" class="mp-input" maxlength="4" placeholder="0000" readonly>
                <div class="mp-keypad">
                    <button class="mp-key" onclick="typeCode('1')">1</button><button class="mp-key" onclick="typeCode('2')">2</button><button class="mp-key" onclick="typeCode('3')">3</button>
                    <button class="mp-key" onclick="typeCode('4')">4</button><button class="mp-key" onclick="typeCode('5')">5</button><button class="mp-key" onclick="typeCode('6')">6</button>
                    <button class="mp-key" onclick="typeCode('7')">7</button><button class="mp-key" onclick="typeCode('8')">8</button><button class="mp-key" onclick="typeCode('9')">9</button>
                    <button class="mp-key" onclick="typeCode('0')">0</button>
                    <button class="mp-key" onclick="typeCode('C')" style="background:#e74c3c;color:white;">С</button>
                    <button class="mp-key" onclick="joinGame()" style="background:#2ecc71;color:white;">OK</button>
                </div>
            </div>
        </div>
        <button class="back-btn" onclick="cancelLobby()">НАЗАД</button>
    </div>

    <button id="exitBtn" onclick="exitGame()">✖</button>
    <canvas id="gameCanvas"></canvas>
    <div id="msgBox"><h1 id="msgText"></h1><button onclick="exitGame()">В МЕНЮ</button></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const menu = document.getElementById('menu');
        const mpLobby = document.getElementById('mpLobby');
        const exitBtn = document.getElementById('exitBtn');
        const msgBox = document.getElementById('msgBox');
        const msgText = document.getElementById('msgText');
        const musicBtn = document.getElementById('musicBtn');

        let W, H, currentGame = null, timer = 0;
        let me = { x: 0, y: 0, size: 40, speed: 5, moving: false, legSwing: 0, color: '#e74c3c' };
        let friend = { x: 0, y: 0, size: 40, moving: false, legSwing: 0, color: '#3498db' };

        // --- СЕТЬ (WebRTC) ---
        let peer = null;
        let conn = null;
        let isHost = false;
        let netConnected = false;
        let roomCode = "";

        // Конфиг для обхода NAT (чтобы соединялось в любых сетях)
        const peerConfig = {
            config: {
                'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' },
                    { url: 'stun:global.stun.twilio.com:3478' }
                ]
            },
            debug: 2 // Включаем логи для поиска ошибок
        };

        function unlockMedia() {
            // Разблокировка звука и сети при первом клике
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function showLobby() {
            menu.classList.add('hidden');
            mpLobby.classList.remove('hidden');
        }

        function cancelLobby() {
            mpLobby.classList.add('hidden');
            document.getElementById('mpChoice').classList.remove('hidden');
            document.getElementById('hostForm').classList.add('hidden');
            document.getElementById('joinForm').classList.add('hidden');
            menu.classList.remove('hidden');
            if(conn) conn.close();
            if(peer) peer.destroy();
            netConnected = false;
        }

        function hostGame() {
            isHost = true;
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('mpChoice').classList.add('hidden');
            document.getElementById('hostForm').classList.remove('hidden');
            document.getElementById('roomCodeDisplay').innerText = "....";
            document.getElementById('mpStatus').innerText = "Подключение к сети...";
            
            try {
                peer = new Peer('robloxmini-' + roomCode, peerConfig);
                
                peer.on('open', (id) => {
                    document.getElementById('roomCodeDisplay').innerText = roomCode;
                    document.getElementById('mpStatus').innerText = 'Ждем друга...';
                    speak("Скажи другу код: " + roomCode);
                });
                
                peer.on('connection', (c) => {
                    conn = c;
                    conn.on('open', () => {
                        netConnected = true;
                        document.getElementById('mpStatus').innerText = 'Друг подключился! Выбираю игру...';
                        speak("Друг подключился! Выбираю игру.");
                        setTimeout(() => {
                            mpLobby.classList.add('hidden');
                            menu.classList.remove('hidden');
                        }, 1500);
                    });
                    conn.on('data', (data) => handleData(data));
                    conn.on('close', () => { alert('Друг вышел!'); exitGame(); netConnected = false; });
                });
                peer.on('error', (err) => { 
                    console.error("Peer Error:", err); 
                    let errMsg = "Ошибка сети.";
                    if(err.type === 'unavailable-id') errMsg = "Комната с таким кодом уже есть. Попробуйте еще раз.";
                    else if(err.type === 'network' || err.type === 'server-error') errMsg = "Браузер блокирует сеть. Отключи AdBlock или открой в режиме Инкогнито.";
                    else if(err.type === 'browser-incompatible') errMsg = "Этот браузер не поддерживает онлайн. Попробуй Chrome.";
                    alert(errMsg + " (Тип ошибки: " + err.type + ")");
                    cancelLobby(); 
                });
            } catch(e) {
                alert("Критическая ошибка: " + e.message);
                cancelLobby();
            }
        }

        function typeCode(val) {
            let input = document.getElementById('codeInput');
            if (val === 'C') input.value = input.value.slice(0, -1);
            else if (input.value.length < 4) input.value += val;
        }

        function joinGame() {
            let code = document.getElementById('codeInput').value;
            if (code.length !== 4) return;
            
            isHost = false;
            speak("Подключаемся к другу...");
            
            try {
                peer = new Peer(peerConfig);
                peer.on('open', (id) => {
                    conn = peer.connect('robloxmini-' + code, {reliable: true});
                    conn.on('open', () => {
                        netConnected = true;
                        mpLobby.classList.add('hidden');
                        speak("Успешно! Ждем выбора игры.");
                    });
                    conn.on('data', (data) => handleData(data));
                    conn.on('close', () => { alert('Хост закрыл игру!'); exitGame(); netConnected = false; });
                    // Таймаут, если не подключилось
                    setTimeout(() => {
                        if(!netConnected) alert("Не удалось подключиться. Проверь код или попроси друга создать игру заново.");
                    }, 5000);
                });
                peer.on('error', (err) => { 
                    console.error("Peer Error:", err);
                    let errMsg = "Ошибка сети.";
                    if(err.type === 'peer-unavailable') errMsg = "Игры с таким кодом нет. Проверь код или попроси друга создать игру заново.";
                    else if(err.type === 'network' || err.type === 'server-error') errMsg = "Браузер блокирует сеть. Отключи AdBlock или открой в режиме Инкогнито.";
                    else if(err.type === 'browser-incompatible') errMsg = "Этот браузер не поддерживает онлайн. Попробуй Chrome.";
                    alert(errMsg + " (Тип ошибки: " + err.type + ")");
                });
            } catch(e) {
                alert("Критическая ошибка: " + e.message);
            }
        }

        function handleData(data) {
            if (data.type === 'startGame') {
                currentGame = data.mode;
                timer = 0;
                me.x = W/2; me.y = H/2;
                friend.x = W/2 + 50; friend.y = H/2;
                if (!isHost) speak("Игра началась!");
            } else if (data.type === 'state') {
                friend.x = data.p.x; friend.y = data.p.y; friend.moving = data.p.m; friend.legSwing = data.p.l;
                currentGame = data.g;
                if (data.obj) {
                    blocks = data.obj.b || [];
                    monster = data.obj.m || null;
                    chaser = data.obj.c || null;
                    boxes3 = data.obj.boxes || [];
                    animals = data.obj.a || [];
                    foods = data.obj.f || [];
                    huggy = data.obj.h || { looking: false };
                }
            } else if (data.type === 'input') {
                friend.tx = data.x; friend.ty = data.y;
            } else if (data.type === 'msg') {
                showMsg(data.text);
            } else if (data.type === 'exit') {
                alert('Друг вышел в меню!');
                exitGame();
            }
        }

        function sendMsgToFriend(text) {
            if (netConnected && conn && conn.open) conn.send({ type: 'msg', text: text });
        }

        // --- СИНТЕЗАТОР МУЗЫКИ ---
        let audioCtx = null, musicOn = false, musicInterval = null, musicStep = 0;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playNote(freq, duration, type = 'square', volume = 0.1) {
            if (!audioCtx || !musicOn) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playNoise(duration, volume = 0.05) {
            if (!audioCtx || !musicOn) return;
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(); noise.stop(audioCtx.currentTime + duration);
        }
        const melody = [262, 330, 392, 523, 494, 392, 330, 262];
        function musicTick() {
            if (!musicOn) return;
            playNoise(0.05, 0.03);
            let step = musicStep % 8;
            if (step === 0 || step === 4) playNote(60, 0.15, 'sine', 0.3);
            if (step === 2 || step === 6) playNoise(0.1, 0.1);
            playNote(melody[step], 0.2, 'square', 0.08);
            if (step % 2 === 0) playNote(melody[step] / 2, 0.3, 'triangle', 0.06);
            musicStep++;
        }
        function toggleMusic() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            musicOn = !musicOn;
            musicBtn.innerHTML = musicOn ? "🔊" : "🔇";
            musicBtn.style.background = musicOn ? "rgba(46, 204, 113,0.9)" : "rgba(0,0,0,0.6)";
            if (musicOn) {
                if(musicInterval) clearInterval(musicInterval);
                musicInterval = setInterval(musicTick, 200);
            } else {
                clearInterval(musicInterval);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; }
        window.addEventListener('resize', resize); resize();

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ru-RU'; u.rate = 1.1;
                window.speechSynthesis.speak(u);
            }
        }

        let touchX = null, touchY = null;
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); let t = e.touches[0]; touchX = t.clientX; touchY = t.clientY; }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); let t = e.touches[0]; touchX = t.clientX; touchY = t.clientY; }, {passive: false});
        canvas.addEventListener('touchend', () => { touchX = null; touchY = null; });
        canvas.addEventListener('mousedown', (e) => { touchX = e.clientX; touchY = e.clientY; });
        canvas.addEventListener('mouseup', () => { touchX = null; touchY = null; });
        canvas.addEventListener('mousemove', (e) => { if(touchX!==null){touchX = e.clientX; touchY = e.clientY;} });

        function startGame(mode) {
            currentGame = mode;
            menu.classList.add('hidden');
            exitBtn.style.display = 'flex';
            timer = 0;
            me.x = W/2; me.y = H/2;
            friend.x = W/2 + 50; friend.y = H/2;
            msgBox.classList.remove('show'); msgBox.style.display = 'none';

            if (mode === 1) { speak("Строй дом от Хагги Вагги!"); blocks = []; monster = null; }
            if (mode === 2) { speak("Беги от монстра!"); chaser = { x: 100, y: H/2 }; }
            if (mode === 3) { speak("Прятки от Хагги Вагги. Прячься за коробки!"); huggy = { looking: false }; boxes3 = []; for(let i=0; i<5; i++) { boxes3.push({ x: 100 + Math.random() * (W-200), y: 200 + Math.random() * (H-400) }); } }
            if (mode === 4) { speak("Лечи животных. Нажимай на них!"); animals = []; }
            if (mode === 5) { speak("Лови вкусное. Не лови гадость!"); foods = []; }
            if (!musicOn) toggleMusic();

            if (netConnected && isHost && conn && conn.open) {
                conn.send({ type: 'startGame', mode: mode });
            }
        }

        function exitGame() {
            if (netConnected && conn && conn.open) conn.send({ type: 'exit' });
            currentGame = null;
            menu.classList.remove('hidden');
            exitBtn.style.display = 'none';
            msgBox.classList.remove('show'); msgBox.style.display = 'none';
            window.speechSynthesis.cancel();
            if (musicOn) toggleMusic();
        }

        function showMsg(text) {
            msgText.innerHTML = text;
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.classList.add('show'), 10);
            speak(text.replace(/<br>/g, ' '));
            exitBtn.style.display = 'none';
            if (netConnected && isHost) sendMsgToFriend(text.replace(/<br>/g, ' '));
            currentGame = null;
            if (musicOn) toggleMusic();
        }

        let lastSync = 0;
        function loop() {
            if (currentGame !== null) {
                if (isHost || !netConnected) {
                    update();
                    if (netConnected && Date.now() - lastSync > 50) {
                        lastSync = Date.now();
                        conn.send({ 
                            type: 'state', 
                            p: {x: me.x, y: me.y, m: me.moving, l: me.legSwing}, 
                            g: currentGame,
                            obj: { b: blocks, m: monster, c: chaser, boxes: boxes3, a: animals, f: foods, h: huggy }
                        });
                    }
                } else {
                    updatePlayer(me);
                    if (Date.now() - lastSync > 50) {
                        lastSync = Date.now();
                        conn.send({ type: 'input', x: touchX || me.x, y: touchY || me.y });
                    }
                }
                draw();
            }
            requestAnimationFrame(loop);
        }

        function update() {
            timer++;
            updatePlayer(me);
            
            if (netConnected && friend.tx !== undefined) {
                let dx = friend.tx - friend.x;
                let dy = friend.ty - friend.y;
                let dist = Math.hypot(dx, dy);
                friend.moving = dist > 5;
                if (dist > me.speed) {
                    friend.x += (dx/dist) * me.speed;
                    friend.y += (dy/dist) * me.speed;
                }
                friend.legSwing = (friend.legSwing + 0.2) % (Math.PI * 2);
            }

            if (currentGame === 1) updateMode1();
            if (currentGame === 2) updateMode2();
            if (currentGame === 3) updateMode3();
            if (currentGame === 4) updateMode4();
            if (currentGame === 5) updateMode5();
        }

        function updatePlayer(p) {
            p.legSwing = (p.legSwing + 0.2) % (Math.PI * 2);
            if (touchX !== null) {
                p.moving = true;
                let dx = touchX - p.x; let dy = touchY - p.y;
                let dist = Math.hypot(dx, dy);
                if (dist > p.speed) {
                    p.x += (dx/dist) * p.speed;
                    p.y += (dy/dist) * p.speed;
                }
            } else { p.moving = false; }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            if (currentGame === 1) drawMode1();
            if (currentGame === 2) drawMode2();
            if (currentGame === 3) drawMode3();
            if (currentGame === 4) drawMode4();
            if (currentGame === 5) drawMode5();
            
            if (netConnected) drawPlayer(friend);
            drawPlayer(me);
        }

        function drawPlayer(p) {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(p.x, p.y + 25, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.save(); ctx.translate(p.x, p.y);
            if (p.moving) ctx.rotate(Math.sin(p.legSwing) * 0.1);
            
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-15, 10, 12, 20 + (p.moving ? Math.sin(p.legSwing)*5 : 0));
            ctx.fillRect(3, 10, 12, 20 - (p.moving ? Math.sin(p.legSwing)*5 : 0));
            
            ctx.fillStyle = p.color;
            ctx.fillRect(-20, -15, 40, 35);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(-20, 10, 40, 10); 
            
            ctx.fillStyle = '#f1c27f';
            ctx.fillRect(-25, -10, 5, 15);
            ctx.fillRect(20, -10, 5, 15);
            
            ctx.fillStyle = '#f1c27f';
            ctx.beginPath(); ctx.arc(0, -25, 18, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-6, -28, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -28, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(-6, -28, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -28, 2, 0, Math.PI * 2); ctx.fill();
            
            ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -20, 8, 0, Math.PI); ctx.stroke();
            ctx.restore();
        }

        // --- РЕЖИМ 1 ---
        let blocks = [], monster = null;
        function updateMode1() {
            if (timer === 1) speak("Строй стены!");
            if (timer > 600 && !monster) {
                monster = { x: -100, y: H/2, size: 100 };
                speak("Хагги Вагги идет!");
            }
            if (monster) {
                let blocked = false;
                blocks.forEach(b => {
                    if (monster.x > b.x - 50 && monster.x < b.x + 50 && monster.y > b.y - 40 && monster.y < b.y + 40) {
                        b.health -= 1; blocked = true;
                        if (b.health <= 0) blocks.splice(blocks.indexOf(b), 1);
                    }
                });
                if(!blocked) monster.x += 1.5;
                if (monster.x > W + 100) showMsg('🎉 Победа!<br>Хагги не достал вас!');
                if (Math.hypot(monster.x - me.x, monster.y - me.y) < 60 || (netConnected && Math.hypot(monster.x - friend.x, monster.y - friend.y) < 60)) showMsg('💀 Проиграл!<br>Хагги съел вас!');
            }
            if (touchX !== null && timer % 10 === 0 && (isHost || !netConnected)) blocks.push({x: touchX, y: touchY, health: 3});
        }
        function drawMode1() {
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#87CEEB'); grad.addColorStop(0.7, '#87CEEB'); grad.addColorStop(0.7, '#2ecc71'); grad.addColorStop(1, '#27ae60');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(W*0.2, 100, 30, 0, Math.PI*2); ctx.arc(W*0.2+30, 100, 40, 0, Math.PI*2); ctx.arc(W*0.2+60, 100, 30, 0, Math.PI*2); ctx.fill();
            if(touchX !== null) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#e67e22'; ctx.fillRect(touchX-20, touchY-15, 40, 30); ctx.globalAlpha = 1; }
            blocks.forEach(b => {
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(b.x-18, b.y-13, 40, 30);
                ctx.fillStyle = '#e67e22'; ctx.fillRect(b.x-20, b.y-15, 40, 30);
                ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(b.x-20, b.y-15, 40, 30);
            });
            if (monster) {
                ctx.fillStyle = '#2a36b1'; ctx.fillRect(monster.x-40, monster.y-60, 80, 120);
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(monster.x-20, monster.y-40, 15, 0, Math.PI*2); ctx.arc(monster.x+20, monster.y-40, 15, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(monster.x-20, monster.y-40, 6, 0, Math.PI*2); ctx.arc(monster.x+20, monster.y-40, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#d50000'; ctx.beginPath(); ctx.moveTo(monster.x-30, monster.y); ctx.quadraticCurveTo(monster.x, monster.y+40, monster.x+30, monster.y); ctx.quadraticCurveTo(monster.x, monster.y+20, monster.x-30, monster.y); ctx.fill();
            }
        }

        // --- РЕЖИМ 2 ---
        let chaser = { x: 100, y: H/2 };
        function updateMode2() {
            if (timer === 1) speak("Беги!");
            chaser.x += (me.x - chaser.x) * 0.01; chaser.y += (me.y - chaser.y) * 0.01;
            if (timer > 3600) showMsg('🎉 Вы убежали!<br>Ничего не получили!');
            if (Math.hypot(chaser.x - me.x, chaser.y - me.y) < 50) showMsg('💀 Тебя поймали!');
        }
        function drawMode2() {
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0,0,W,H);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 5; ctx.setLineDash([30, 20]);
            ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(chaser.x, chaser.y + 30, 30, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.font = '60px Arial'; ctx.textAlign = 'center'; ctx.fillText('👻', chaser.x, chaser.y);
        }

        // --- РЕЖИМ 3 ---
        let huggy = { looking: false }, huggyTimer = 0, boxes3 = [];
        function updateMode3() {
            if(me.y < 100 || (netConnected && friend.y < 100)) { showMsg('🎉 Вы сбежали<br>от Хагги!'); return; }
            huggyTimer++;
            if (huggyTimer > 150) {
                huggy.looking = !huggy.looking; huggyTimer = 0;
                if(huggy.looking) speak("Хагги смотрит! Прячься!"); else speak("Иди!");
            }
            if (huggy.looking) {
                let isHiddenMe = false, isHiddenFriend = false;
                for(let b of boxes3) {
                    if (Math.hypot(b.x - me.x, b.y - me.y) < 60) isHiddenMe = true;
                    if (netConnected && Math.hypot(b.x - friend.x, b.y - friend.y) < 60) isHiddenFriend = true;
                }
                if (!isHiddenMe) showMsg('💀 Хагги Вагги<br>тебя увидел!');
            }
        }
        function drawMode3() {
            ctx.fillStyle = huggy.looking ? '#4a0000' : '#2c3e50'; ctx.fillRect(0,0,W,H);
            if(huggy.looking) {
                let grad = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H);
                grad.addColorStop(0, 'rgba(255,0,0,0.4)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            }
            ctx.font = '60px Arial'; ctx.textAlign = 'center';
            boxes3.forEach(b => { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(b.x, b.y + 25, 30, 0, Math.PI*2); ctx.fill(); ctx.fillText('📦', b.x, b.y); });
            ctx.fillStyle = '#2a36b1'; ctx.fillRect(W/2-40, -60, 80, 120);
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(W/2-20, 10, 15, 0, Math.PI*2); ctx.arc(W/2+20, 10, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(W/2-20, 10, 6, 0, Math.PI*2); ctx.arc(W/2+20, 10, 6, 0, Math.PI*2); ctx.fill();
        }

        // --- РЕЖИМ 4 ---
        let animals = []; const animalTypes = ['🐶', '🐱', '🐰', '🐹', '🐻'];
        function updateMode4() {
            if (timer === 1) speak("Лечи животных. Нажимай на них!");
            if (timer % 100 === 0 && animals.length < 5) {
                animals.push({ x: 100 + Math.random() * (W-200), y: 200 + Math.random() * (H-250), sick: true, type: animalTypes[Math.floor(Math.random() * animalTypes.length)] });
            }
            animals.forEach(a => {
                if (a.sick && touchX !== null && Math.hypot(touchX - a.x, touchY - a.y) < 50) {
                    a.sick = false; speak("Молодец! Животное здорово!");
                    setTimeout(() => { const idx = animals.indexOf(a); if(idx > -1) animals.splice(idx, 1); }, 2000);
                }
            });
        }
        function drawMode4() {
            ctx.fillStyle = '#ecf0f1'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(0, H-50, W, 50);
            ctx.fillStyle = '#e74c3c'; ctx.font = '40px Arial';
            for(let i=0; i<5; i++) ctx.fillText('✚', 100 + i*(W/5), 100);
            animals.forEach(a => {
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.ellipse(a.x, a.y + 25, 25, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.font = '50px Arial'; ctx.textAlign = 'center'; ctx.fillText(a.type, a.x, a.y);
                if(a.sick) { ctx.font = '30px Arial'; ctx.fillText('🤢', a.x + 30, a.y - 20); } 
                else { ctx.font = '30px Arial'; ctx.fillText('❤️', a.x + 30, a.y - 20); }
            });
        }

        // --- РЕЖИМ 5 ---
        let foods = [];
        function updateMode5() {
            if (timer === 1) speak("Лови вкусное. Не лови гадость!");
            if (timer % 40 === 0) foods.push({ x: Math.random() * W, y: -50, type: Math.random() > 0.5 ? 'good' : 'bad' });
            foods.forEach(f => {
                f.y += 5;
                if (Math.hypot(f.x - me.x, f.y - me.y) < 40) {
                    if (f.type === 'bad') showMsg('🤢 Фу! Надо в туалет!');
                    else speak("Вкусно!");
                    foods.splice(foods.indexOf(f), 1);
                }
                if (f.y > H) foods.splice(foods.indexOf(f), 1);
            });
        }
        function drawMode5() {
            let grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0, '#ff9a9e'); grad.addColorStop(1, '#fecfef');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            foods.forEach(f => { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText(f.type === 'good' ? '🍕' : '🤢', f.x, f.y); });
        }

        loop();
    </script>
</body>
