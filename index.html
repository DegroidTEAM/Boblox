<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Роблокс Мини Игры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', 'Arial', sans-serif; user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top, #4a00e0, #8e2de2, #00c6ff); display: flex; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 10; padding: 20px; overflow-y: auto; }
        .title { color: white; font-size: 34px; font-weight: 900; margin-top: 20px; margin-bottom: 15px; text-shadow: 3px 3px 0 rgba(0,0,0,0.4); text-align: center; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; padding-bottom: 40px; }
        .game-btn { background: white; border: none; border-radius: 20px; padding: 15px; text-align: left; box-shadow: 0 6px 0 rgba(0,0,0,0.3); transition: transform 0.1s; display: flex; align-items: center; cursor: pointer; }
        .game-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .btn-icon { font-size: 40px; margin-right: 15px; }
        .btn-text { color: #2c3e50; font-weight: 800; font-size: 18px; }
        
        #exitBtn { position: absolute; top: 15px; right: 15px; background: rgba(231, 76, 60,0.9); color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-size: 22px; z-index: 15; display: none; align-items: center; justify-content: center; }
        #msgBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; color: #2c3e50; padding: 30px 40px; border-radius: 25px; text-align: center; z-index: 20; display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 4px solid #8e2de2; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 85%; max-width: 320px; }
        #msgBox.show { transform: translate(-50%, -50%) scale(1); }
        #msgBox h1 { font-size: 28px; margin-bottom: 20px; font-weight: 900; }
        #msgBox button { background: #8e2de2; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #6a1b9a; }

        .toggle { display: flex; background: white; border-radius: 20px; padding: 5px; margin-bottom: 10px; justify-content: center; }
        .tb { padding: 10px 20px; font-size: 18px; font-weight: 700; color: #2c3e50; background: none; border: none; border-radius: 15px; cursor: pointer; }
        .ta { background: #8e2de2; color: white !important; }

        #joystick1, #joystick2 { position: absolute; bottom: 30px; width: 120px; height: 120px; z-index: 5; display: none; pointer-events: none; }
        #joystick1 { left: 30px; }
        #joystick2 { right: 30px; }
        .joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.4); position: absolute; }
        .joystick-stick { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.8); position: absolute; top: 30px; left: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        #score1, #score2 { position: absolute; top: 15px; font-size: 20px; font-weight: 700; color: white; z-index: 5; display: none; text-shadow: 1px 1px 2px black; }
        #score1 { left: 80px; }
        #score2 { right: 80px; }

        #musicBtn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; z-index: 15; display: flex; align-items: center; justify-content: center; }
        #rotHint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 15px; z-index: 30; display: none; text-align: center; }
    </style>
</head>
<body>

    <button id="musicBtn" onclick="toggleMusic()">🔇</button>
    <div id="menu">
        <div class="title">🎮 ИГРЫ</div>
        <div class="toggle">
            <button class="tb ta" onclick="setMode(1)">1 ИГРОК</button>
            <button class="tb" onclick="setMode(2)">2 ИГРОКА</button>
        </div>
        <div class="btn-container">
            <button class="game-btn" onclick="startGame(1)"><div class="btn-icon">🏠</div><div class="btn-text">Дом от Хагги</div></button>
            <button class="game-btn" onclick="startGame(2)"><div class="btn-icon">🏃</div><div class="btn-text">Убеги от монстра</div></button>
            <button class="game-btn" onclick="startGame(3)"><div class="btn-icon">🙈</div><div class="btn-text">Прятки Хагги</div></button>
            <button class="game-btn" onclick="startGame(4)"><div class="btn-icon">🏥</div><div class="btn-text">Больница</div></button>
            <button class="game-btn" onclick="startGame(5)"><div class="btn-icon">🍔</div><div class="btn-text">Вкусно или Туалет</div></button>
            <button class="game-btn" onclick="startGame(6)"><div class="btn-icon">🛵</div><div class="btn-text">Ресторан Еды</div></button>
            <button class="game-btn" onclick="startGame(7)"><div class="btn-icon">🥤</div><div class="btn-text">Мутант Кола</div></button>
            <button class="game-btn" onclick="startGame(8)"><div class="btn-icon">🐻</div><div class="btn-text">Мишка Берлога</div></button>
            <button class="game-btn" onclick="startGame(9)"><div class="btn-icon">🛏️</div><div class="btn-text">Аномалия Зубы</div></button>
            <button class="game-btn" onclick="startGame(10)"><div class="btn-icon">🎥</div><div class="btn-text">Сим Ютубера</div></button>
            <button class="game-btn" onclick="startGame(11)"><div class="btn-icon">🐹</div><div class="btn-text">Эдит Хомяки</div></button>
            <button class="game-btn" onclick="startGame(12)"><div class="btn-icon">🎨</div><div class="btn-text">Рисование Кур</div></button>
            <button class="game-btn" onclick="startGame(13)"><div class="btn-icon">🧙‍♀️</div><div class="btn-text">Белая Ведьма</div></button>
            <button class="game-btn" onclick="startGame(14)"><div class="btn-icon">🥓</div><div class="btn-text">1000 Беконов</div></button>
        </div>
    </div>

    <div id="score1">P1: 0</div><div id="score2">P2: 0</div>
    <button id="exitBtn" onclick="exitGame()">✖</button>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="joystick1"><div class="joystick-base"></div><div class="joystick-stick"></div></div>
    <div id="joystick2"><div class="joystick-base"></div><div class="joystick-stick"></div></div>
    <div id="msgBox"><h1 id="msgText"></h1><button onclick="exitGame()">В МЕНЮ</button></div>
    <div id="rotHint">Поверни телефон вертикально! ⬆️<br><button onclick="document.getElementById('rotHint').style.display='none'">ОК</button></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const exitBtn = document.getElementById('exitBtn');
        const msgBox = document.getElementById('msgBox');
        const msgText = document.getElementById('msgText');
        const joy1Div = document.getElementById('joystick1');
        const joy2Div = document.getElementById('joystick2');
        const score1Div = document.getElementById('score1');
        const score2Div = document.getElementById('score2');
        const musicBtn = document.getElementById('musicBtn');
        const rotHint = document.getElementById('rotHint');

        let W, H, currentGame = 0, timer = 0, gMode = 1;
        let p1 = { x: 100, y: 0, vx: 0, vy: 0, ls: 0, angle: 0, mt: 0, score: 0, carry: null, honey: 0 };
        let p2 = { x: 200, y: 0, vx: 0, vy: 0, ls: 0, angle: 0, mt: 0, score: 0, carry: null, honey: 0 };
        let j1 = { active: false, bx: 90, by: 0, dx: 0, dy: 0, id: null };
        let j2 = { active: false, bx: 0, by: 0, dx: 0, dy: 0, id: null };

        // --- МУЗЫКА ---
        let ac=null, mOn=false, mInt=null, mStep=0;
        function toggleMusic() {
            if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === 'suspended') ac.resume();
            mOn = !mOn;
            musicBtn.innerHTML = mOn ? "🔊" : "🔇";
            musicBtn.style.background = mOn ? "rgba(46, 204, 113,0.9)" : "rgba(0,0,0,0.6)";
            if (mOn) {
                if(mInt) clearInterval(mInt);
                mInt = setInterval(musicTick, 200);
            } else {
                clearInterval(mInt);
            }
        }
        function musicTick() {
            if (!mOn || !ac) return;
            pNoise(0.05, 0.03);
            let s = mStep % 8;
            if (s === 0 || s === 4) pNote(60, 0.15, 'sine', 0.3);
            if (s === 2 || s === 6) pNoise(0.1, 0.1);
            pNote([262, 330, 392, 523, 494, 392, 330, 262][s], 0.2, 'square', 0.08);
            if (s % 2 === 0) pNote([131, 165, 196, 262][s/2], 0.3, 'triangle', 0.06);
            mStep++;
        }
        function pNote(freq, duration, type='square', volume=0.1) {
            if (!ac || !mOn) return;
            let osc = ac.createOscillator(), gain = ac.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            osc.connect(gain); gain.connect(ac.destination);
            osc.start(); osc.stop(ac.currentTime + duration);
        }
        function pNoise(duration, volume=0.05) {
            if (!ac || !mOn) return;
            const bs = ac.sampleRate * duration, b = ac.createBuffer(1, bs, ac.sampleRate), dt = b.getChannelData(0);
            for (let i=0; i<bs; i++) dt[i] = Math.random()*2-1;
            const n = ac.createBufferSource(); n.buffer = b;
            const f = ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1000;
            const g = ac.createGain();
            g.gain.setValueAtTime(volume, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
            n.connect(f); f.connect(g); g.connect(ac.destination);
            n.start(); n.stop(ac.currentTime + duration);
        }

        // --- ЭКРАН ---
        function resize() { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; j1.by = H - 90; j2.bx = W - 90; j2.by = H - 90; checkOrient(); }
        function checkOrient() { if (innerWidth > innerHeight && currentGame !== 0) { rotHint.style.display = 'block'; } else { rotHint.style.display = 'none'; } }
        addEventListener('resize', resize); resize();

        // --- ОЗВУЧКА ---
        function sp(v) { try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(v); u.lang = 'ru-RU'; u.rate = 1.1; speechSynthesis.speak(u); } } catch(e){} }

        // --- УПРАВЛЕНИЕ ---
        function setMode(n) { gMode = n; document.querySelectorAll('.tb').forEach((b,i) => b.classList.toggle('ta', i === n-1)); }
        function handleTS(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.clientX < W/2 && j1.id === null) {
                    j1.id = t.identifier; j1.active = true;
                    j1.dx = t.clientX - j1.bx; j1.dy = t.clientY - j1.by;
                    let d = Math.hypot(j1.dx, j1.dy); if (d > 40) { j1.dx = (j1.dx/d)*40; j1.dy = (j1.dy/d)*40; }
                    joy1Div.children[1].style.transform = `translate(${j1.dx}px, ${j1.dy}px)`;
                } else if (t.clientX >= W/2 && j2.id === null && gMode === 2) {
                    j2.id = t.identifier; j2.active = true;
                    j2.dx = t.clientX - j2.bx; j2.dy = t.clientY - j2.by;
                    let d = Math.hypot(j2.dx, j2.dy); if (d > 40) { j2.dx = (j2.dx/d)*40; j2.dy = (j2.dy/d)*40; }
                    joy2Div.children[1].style.transform = `translate(${j2.dx}px, ${j2.dy}px)`;
                }
            }
        }
        function handleTM(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === j1.id) {
                    j1.dx = t.clientX - j1.bx; j1.dy = t.clientY - j1.by;
                    let d = Math.hypot(j1.dx, j1.dy); if (d > 40) { j1.dx = (j1.dx/d)*40; j1.dy = (j1.dy/d)*40; }
                    joy1Div.children[1].style.transform = `translate(${j1.dx}px, ${j1.dy}px)`;
                } else if (t.identifier === j2.id) {
                    j2.dx = t.clientX - j2.bx; j2.dy = t.clientY - j2.by;
                    let d = Math.hypot(j2.dx, j2.dy); if (d > 40) { j2.dx = (j2.dx/d)*40; j2.dy = (j2.dy/d)*40; }
                    joy2Div.children[1].style.transform = `translate(${j2.dx}px, ${j2.dy}px)`;
                }
            }
        }
        function handleTE(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === j1.id) { j1.active = false; j1.dx = 0; j1.dy = 0; j1.id = null; joy1Div.children[1].style.transform = 'translate(0,0)'; }
                else if (t.identifier === j2.id) { j2.active = false; j2.dx = 0; j2.dy = 0; j2.id = null; joy2Div.children[1].style.transform = 'translate(0,0)'; }
            }
        }
        canvas.addEventListener('touchstart', handleTS, {passive: false});
        canvas.addEventListener('touchmove', handleTM, {passive: false});
        canvas.addEventListener('touchend', handleTE, {passive: false});
        canvas.addEventListener('touchcancel', handleTE, {passive: false});

        canvas.addEventListener('mousedown', e => {
            toggleMusic(); // unlock audio
            if (e.clientX < W/2) {
                j1.active = true; j1.dx = e.clientX - j1.bx; j1.dy = e.clientY - j1.by;
                let d = Math.hypot(j1.dx, j1.dy); if (d > 40) { j1.dx = (j1.dx/d)*40; j1.dy = (j1.dy/d)*40; }
                joy1Div.children[1].style.transform = `translate(${j1.dx}px, ${j1.dy}px)`;
            } else if (gMode === 2) {
                j2.active = true; j2.dx = e.clientX - j2.bx; j2.dy = e.clientY - j2.by;
                let d = Math.hypot(j2.dx, j2.dy); if (d > 40) { j2.dx = (j2.dx/d)*40; j2.dy = (j2.dy/d)*40; }
                joy2Div.children[1].style.transform = `translate(${j2.dx}px, ${j2.dy}px)`;
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (j1.active) {
                j1.dx = e.clientX - j1.bx; j1.dy = e.clientY - j1.by;
                let d = Math.hypot(j1.dx, j1.dy); if (d > 40) { j1.dx = (j1.dx/d)*40; j1.dy = (j1.dy/d)*40; }
                joy1Div.children[1].style.transform = `translate(${j1.dx}px, ${j1.dy}px)`;
            } else if (j2.active) {
                j2.dx = e.clientX - j2.bx; j2.dy = e.clientY - j2.by;
                let d = Math.hypot(j2.dx, j2.dy); if (d > 40) { j2.dx = (j2.dx/d)*40; j2.dy = (j2.dy/d)*40; }
                joy2Div.children[1].style.transform = `translate(${j2.dx}px, ${j2.dy}px)`;
            }
        });
        canvas.addEventListener('mouseup', () => {
            j1.active = false; j1.dx = 0; j1.dy = 0; joy1Div.children[1].style.transform = 'translate(0,0)';
            j2.active = false; j2.dx = 0; j2.dy = 0; joy2Div.children[1].style.transform = 'translate(0,0)';
        });

        function startGame(n) {
            currentGame = n; menu.style.display = 'none'; exitBtn.style.display = 'flex'; timer = 0;
            joy1Div.style.display = 'block'; score1Div.style.display = 'block';
            if (gMode === 2) { joy2Div.style.display = 'block'; score2Div.style.display = 'block'; } else { joy2Div.style.display = 'none'; score2Div.style.display = 'none'; }
            p1.x = W/2-50; p1.y = H/2; p1.score = 0; p1.carry = null; p1.mt = 0; p1.honey = 0;
            p2.x = W/2+50; p2.y = H/2; p2.score = 0; p2.carry = null; p2.mt = 0; p2.honey = 0;
            msgBox.classList.remove('show'); msgBox.style.display = 'none';
            if (!mOn) toggleMusic(); checkOrient();
            
            if (n===1) sp("Строй дом!");
            else if (n===2) sp("Беги!");
            else if (n===3) { sp("Прятки!"); huggy = {looking: false}; huggyTimer = 0; boxes3 = []; for(let i=0; i<5; i++) boxes3.push({x:100+Math.random()*(W-200), y:200+Math.random()*(H-400)}); }
            else if (n===4) sp("Лечи животных!");
            else if (n===5) sp("Лови еду!");
            else if (n===6) { sp("Ресторан!"); orders=[]; delivery=[]; phone={x:W/2,y:100}; tables=[]; }
            else if (n===7) { sp("Пей колу!"); bots=[]; cola=[]; for(let i=0; i<5; i++) cola.push({x:Math.random()*W, y:Math.random()*H}); }
            else if (n===8) { sp("Собери мед!"); coins=[]; home={x:W/2, y:H-150, level:0}; }
            else if (n===9) sp("Аномалия зубы!");
            else if (n===10) sp("Снимай видео!");
            else if (n===11) sp("Эдит хомяки!");
            else if (n===12) sp("Рисуй кур!");
            else if (n===13) sp("Уворачивайся от ведьмы!");
            else if (n===14) { sp("1000 беконов!"); bacons=[]; spawnTimer=0; }
        }
        function exitGame() {
            currentGame = 0; menu.style.display = 'flex'; exitBtn.style.display = 'none';
            joy1Div.style.display = 'none'; joy2Div.style.display = 'none';
            score1Div.style.display = 'none'; score2Div.style.display = 'none';
            msgBox.classList.remove('show'); msgBox.style.display = 'none';
            rotHint.style.display = 'none'; speechSynthesis.cancel();
            if (mOn) toggleMusic();
        }
        function showMsg(v) {
            msgText.innerHTML = v; msgBox.style.display = 'block';
            setTimeout(() => msgBox.classList.add('show'), 10);
            sp(v.replace(/<br>/g, ' '));
            exitBtn.style.display = 'none'; joy1Div.style.display = 'none'; joy2Div.style.display = 'none';
            score1Div.style.display = 'none'; score2Div.style.display = 'none'; currentGame = 0;
            if (mOn) toggleMusic();
        }

        function loop() { if (currentGame !== 0) { update(); draw(); } requestAnimationFrame(loop); }
        function update() {
            timer++;
            p1.vx = j1.dx/40*4; p1.vy = j1.dy/40*4; p2.vx = j2.dx/40*4; p2.vy = j2.dy/40*4;
            updatePlayer(p1); if (gMode === 2) updatePlayer(p2);
            
            if (currentGame===1) u1(); else if (currentGame===2) u2(); else if (currentGame===3) u3();
            else if (currentGame===4) u4(); else if (currentGame===5) u5(); else if (currentGame===6) u6();
            else if (currentGame===7) u7(); else if (currentGame===8) u8(); else if (currentGame===9) u9();
            else if (currentGame===10) u10(); else if (currentGame===11) u11(); else if (currentGame===12) u12();
            else if (currentGame===13) u13(); else if (currentGame===14) u14();
            
            score1Div.innerText = 'P1: ' + (currentGame===8 ? p1.honey : p1.score);
            score2Div.innerText = 'P2: ' + (currentGame===8 ? p2.honey : p2.score);
        }
        function updatePlayer(p) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 20) p.x = 20; if (p.x > W-20) p.x = W-20; if (p.y < 20) p.y = 20; if (p.y > H-20) p.y = H-20;
            if (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) p.ls = (p.ls + 0.3) % (2*Math.PI);
            p.angle = Math.atan2(p.vy, p.vx);
        }
        function draw() {
            ctx.clearRect(0, 0, W, H);
            if (currentGame===1) d1(); else if (currentGame===2) d2(); else if (currentGame===3) d3();
            else if (currentGame===4) d4(); else if (currentGame===5) d5(); else if (currentGame===6) d6();
            else if (currentGame===7) d7(); else if (currentGame===8) d8(); else if (currentGame===9) d9();
            else if (currentGame===10) d10(); else if (currentGame===11) d11(); else if (currentGame===12) d12();
            else if (currentGame===13) d13(); else if (currentGame===14) d14();
            
            if (gMode === 2) drawPlayer(p2, '#3498db');
            drawPlayer(p1, '#e74c3c');
        }
        function drawPlayer(p, col) {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(p.x, p.y+25, 20, 8, 0, 0, 2*Math.PI); ctx.fill();
            ctx.save(); ctx.translate(p.x, p.y);
            if (p.vx !== 0 || p.vy !== 0) ctx.rotate(p.angle + Math.PI/2);
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-15, 10, 12, 20 + (Math.abs(p.vx)>0.1 ? Math.sin(p.ls)*5 : 0));
            ctx.fillRect(3, 10, 12, 20 - (Math.abs(p.vx)>0.1 ? Math.sin(p.ls)*5 : 0));
            ctx.fillStyle = p.mt > 0 ? '#9b59b6' : col;
            ctx.fillRect(-20, -15, 40, 35);
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-20, 10, 40, 10);
            ctx.fillStyle = '#f1c27f'; ctx.fillRect(-25, -10, 5, 15); ctx.fillRect(20, -10, 5, 15);
            ctx.beginPath(); ctx.arc(0, -25, 18, 0, 2*Math.PI); ctx.fill();
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-6, -28, 5, 0, 2*Math.PI); ctx.arc(6, -28, 5, 0, 2*Math.PI); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(-6, -28, 2, 0, 2*Math.PI); ctx.arc(6, -28, 2, 0, 2*Math.PI); ctx.fill();

            ctx.font='60px Arial'; ctx.textAlign='center'; ctx.fillText('🧙‍♀️', witch.x, witch.y);
            potions.forEach(p => { ctx.font='30px Arial'; ctx.fillText('🧪', p.x, p.y); });
        }

        let bacons = [], spawnTimer = 0;
        function u14() {
            if (timer === 1) bacons = [];
            spawnTimer++;
            if (bacons.length < 1000 && spawnTimer % 2 === 0) {
                for (let i=0; i<10; i++) bacons.push({x:Math.random()*W, y:Math.random()*H, d:Math.random()*Math.PI*2, s:Math.random()*20+10});
            }
            bacons.forEach(b => { b.d += .02; b.x += Math.cos(b.d)*b.s*.05; b.y += Math.sin(b.d)*b.s*.05; if (b.x<0) b.x=W; if (b.x>W) b.x=0; if (b.y<0) b.y=H; if (b.y>H) b.y=0; });
        }
        function d14() {
            ctx.fillStyle='#87CEEB'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#FFA07A';
            bacons.forEach(b => { ctx.fillRect(b.x, b.y, 3, 3); });
        }

        loop();
    </script>
