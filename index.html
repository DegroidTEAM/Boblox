<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Роблокс Мини Игры</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', 'Arial', sans-serif; user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        /* Главное меню */
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top, #4a00e0, #8e2de2, #00c6ff); display: flex; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 10; padding: 20px; overflow-y: auto; }
        .title { color: white; font-size: 38px; font-weight: 900; margin-top: 20px; margin-bottom: 15px; text-transform: uppercase; text-shadow: 3px 3px 0px rgba(0,0,0,0.4); animation: bounce 2s infinite; text-align:center; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; padding-bottom: 40px; }
        .game-btn { background: white; border: none; border-radius: 20px; padding: 15px; text-align: left; box-shadow: 0 6px 0 rgba(0,0,0,0.3); transition: transform 0.1s; display: flex; align-items: center; }
        .game-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .btn-icon { font-size: 40px; margin-right: 15px; }
        .btn-text { color: #2c3e50; font-weight: 800; font-size: 18px; }

        /* Переключатель игроков */
        .toggle { display: flex; background: white; border-radius: 20px; padding: 5px; margin-bottom: 15px; justify-content: center; }
        .tb { padding: 10px 20px; font-size: 18px; font-weight: 700; color: #2c3e50; background: none; border: none; border-radius: 15px; }
        .ta { background: #8e2de2; color: white !important; }

        /* UI */
        #exitBtn { position: absolute; top: 15px; right: 15px; background: rgba(231, 76, 60,0.9); color: white; border: 2px solid white; border-radius: 50%; width: 45px; height: 45px; font-size: 22px; z-index: 15; display: none; align-items: center; justify-content: center; }
        #msgBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: white; color: #2c3e50; padding: 30px 40px; border-radius: 25px; text-align: center; z-index: 20; display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 4px solid #8e2de2; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 85%; max-width: 320px; }
        #msgBox.show { transform: translate(-50%, -50%) scale(1); }
        #msgBox h1 { font-size: 28px; margin-bottom: 20px; font-weight: 900; }
        #msgBox button { background: #8e2de2; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #6a1b9a; }

        /* Джойстики */
        #joystick1, #joystick2 { position: absolute; bottom: 30px; width: 120px; height: 120px; z-index: 5; display: none; pointer-events: none; }
        #joystick1 { left: 30px; }
        #joystick2 { right: 30px; }
        .joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.4); position: absolute; }
        .joystick-stick { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.8); position: absolute; top: 30px; left: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        /* Очки */
        #score1, #score2 { position: absolute; top: 15px; font-size: 20px; font-weight: 700; color: white; z-index: 5; display: none; text-shadow: 1px 1px 2px black; }
        #score1 { left: 80px; }
        #score2 { right: 80px; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="title">🎮 ИГРЫ</div>
        <div class="toggle">
            <button class="tb ta" onclick="setMode(1)">1 ИГРОК</button>
            <button class="tb" onclick="setMode(2)">2 ИГРОКА</button>
        </div>
        <div class="btn-container">
            <button class="game-btn" onclick="startGame(1)"><div class="btn-icon">🏠</div><div class="btn-text">Дом от Хагги</div></button>
            <button class="game-btn" onclick="startGame(2)"><div class="btn-icon">🏃</div><div class="btn-text">Убеги от монстра</div></button>
            <button class="game-btn" onclick="startGame(3)"><div class="btn-icon">🙈</div><div class="btn-text">Прятки Хагги</div></button>
            <button class="game-btn" onclick="startGame(4)"><div class="btn-icon">🏥</div><div class="btn-text">Больница</div></button>
            <button class="game-btn" onclick="startGame(5)"><div class="btn-icon">🍔</div><div class="btn-text">Вкусно или Туалет</div></button>
            <button class="game-btn" onclick="startGame(6)"><div class="btn-icon">🛵</div><div class="btn-text">Закажи Еду</div></button>
            <button class="game-btn" onclick="startGame(7)"><div class="btn-icon">🥤</div><div class="btn-text">Мутант Кола</div></button>
            <button class="game-btn" onclick="startGame(8)"><div class="btn-icon">🐻</div><div class="btn-text">Мишка Берлога</div></button>
        </div>
    </div>

    <div id="score1">P1: 0</div>
    <div id="score2">P2: 0</div>
    <button id="exitBtn" onclick="exitGame()">✖</button>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="joystick1"><div class="joystick-base"></div><div class="joystick-stick"></div></div>
    <div id="joystick2"><div class="joystick-base"></div><div class="joystick-stick"></div></div>

    <div id="msgBox"><h1 id="msgText"></h1><button onclick="exitGame()">В МЕНЮ</button></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const exitBtn = document.getElementById('exitBtn');
        const msgBox = document.getElementById('msgBox');
        const msgText = document.getElementById('msgText');
        const joy1Div = document.getElementById('joystick1');
        const joy2Div = document.getElementById('joystick2');
        const score1Div = document.getElementById('score1');
        const score2Div = document.getElementById('score2');

        let W, H, currentGame = null, timer = 0;
        let gMode = 1; // 1 игрок или 2
        
        // Игроки (1 - Красный, 2 - Синий)
        let p1 = { x: 100, y: 0, size: 40, vx: 0, vy: 0, color: '#e74c3c', legSwing: 0, angle: 0, mutantTimer: 0, score: 0, carry: null, honey: 0 };
        let p2 = { x: 200, y: 0, size: 40, vx: 0, vy: 0, color: '#3498db', legSwing: 0, angle: 0, mutantTimer: 0, score: 0, carry: null, honey: 0 };

        // Джойстики
        let joy1 = { active: false, baseX: 90, baseY: 0, dx: 0, dy: 0, touchId: null };
        let joy2 = { active: false, baseX: 0, baseY: 0, dx: 0, dy: 0, touchId: null };

        function resize() { 
            W = window.innerWidth; H = window.innerHeight; 
            canvas.width = W; canvas.height = H; 
            joy1.baseX = 90; joy1.baseY = H - 90;
            joy2.baseX = W - 90; joy2.baseY = H - 90;
        }
        window.addEventListener('resize', resize); resize();

        function speak(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'ru-RU'; u.rate = 1.1;
                    window.speechSynthesis.speak(u);
                }
            } catch(e) {}
        }

        function setMode(n) {
            gMode = n;
            const btns = document.querySelectorAll('.tb');
            btns[0].classList.toggle('ta', n === 1);
            btns[1].classList.toggle('ta', n === 2);
        }

        // --- УПРАВЛЕНИЕ (Мультитач для 2 джойстиков) ---
        function handleTouchStart(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.clientX < W / 2 && joy1.touchId === null) {
                    joy1.touchId = t.identifier;
                    joy1.active = true;
                    joy1.dx = t.clientX - joy1.baseX;
                    joy1.dy = t.clientY - joy1.baseY;
                    let dist = Math.hypot(joy1.dx, joy1.dy);
                    if (dist > 40) { joy1.dx = (joy1.dx/dist)*40; joy1.dy = (joy1.dy/dist)*40; }
                    joy1Div.children[1].style.transform = `translate(${joy1.dx}px, ${joy1.dy}px)`;
                } else if (t.clientX >= W / 2 && joy2.touchId === null && gMode === 2) {
                    joy2.touchId = t.identifier;
                    joy2.active = true;
                    joy2.dx = t.clientX - joy2.baseX;
                    joy2.dy = t.clientY - joy2.baseY;
                    let dist = Math.hypot(joy2.dx, joy2.dy);
                    if (dist > 40) { joy2.dx = (joy2.dx/dist)*40; joy2.dy = (joy2.dy/dist)*40; }
                    joy2Div.children[1].style.transform = `translate(${joy2.dx}px, ${joy2.dy}px)`;
                }
            }
        }
        function handleTouchMove(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === joy1.touchId) {
                    joy1.dx = t.clientX - joy1.baseX;
                    joy1.dy = t.clientY - joy1.baseY;
                    let dist = Math.hypot(joy1.dx, joy1.dy);
                    if (dist > 40) { joy1.dx = (joy1.dx/dist)*40; joy1.dy = (joy1.dy/dist)*40; }
                    joy1Div.children[1].style.transform = `translate(${joy1.dx}px, ${joy1.dy}px)`;
                } else if (t.identifier === joy2.touchId) {
                    joy2.dx = t.clientX - joy2.baseX;
                    joy2.dy = t.clientY - joy2.baseY;
                    let dist = Math.hypot(joy2.dx, joy2.dy);
                    if (dist > 40) { joy2.dx = (joy2.dx/dist)*40; joy2.dy = (joy2.dy/dist)*40; }
                    joy2Div.children[1].style.transform = `translate(${joy2.dx}px, ${joy2.dy}px)`;
                }
            }
        }
        function handleTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (t.identifier === joy1.touchId) {
                    joy1.active = false; joy1.dx = 0; joy1.dy = 0; joy1.touchId = null;
                    joy1Div.children[1].style.transform = 'translate(0,0)';
                } else if (t.identifier === joy2.touchId) {
                    joy2.active = false; joy2.dx = 0; joy2.dy = 0; joy2.touchId = null;
                    joy2Div.children[1].style.transform = 'translate(0,0)';
                }
            }
        }
        canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
        canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
        canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
        canvas.addEventListener('touchcancel', handleTouchEnd, {passive: false});

        // Мышь для ПК
        canvas.addEventListener('mousedown', e => {
            if (e.clientX < W / 2) {
                joy1.active = true;
                joy1.dx = e.clientX - joy1.baseX;
                joy1.dy = e.clientY - joy1.baseY;
                let dist = Math.hypot(joy1.dx, joy1.dy);
                if (dist > 40) { joy1.dx = (joy1.dx/dist)*40; joy1.dy = (joy1.dy/dist)*40; }
                joy1Div.children[1].style.transform = `translate(${joy1.dx}px, ${joy1.dy}px)`;
            } else if (gMode === 2) {
                joy2.active = true;
                joy2.dx = e.clientX - joy2.baseX;
                joy2.dy = e.clientY - joy2.baseY;
                let dist = Math.hypot(joy2.dx, joy2.dy);
                if (dist > 40) { joy2.dx = (joy2.dx/dist)*40; joy2.dy = (joy2.dy/dist)*40; }
                joy2Div.children[1].style.transform = `translate(${joy2.dx}px, ${joy2.dy}px)`;
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (joy1.active) {
                joy1.dx = e.clientX - joy1.baseX;
                joy1.dy = e.clientY - joy1.baseY;
                let dist = Math.hypot(joy1.dx, joy1.dy);
                if (dist > 40) { joy1.dx = (joy1.dx/dist)*40; joy1.dy = (joy1.dy/dist)*40; }
                joy1Div.children[1].style.transform = `translate(${joy1.dx}px, ${joy1.dy}px)`;
            } else if (joy2.active) {
                joy2.dx = e.clientX - joy2.baseX;
                joy2.dy = e.clientY - joy2.baseY;
                let dist = Math.hypot(joy2.dx, joy2.dy);
                if (dist > 40) { joy2.dx = (joy2.dx/dist)*40; joy2.dy = (joy2.dy/dist)*40; }
                joy2Div.children[1].style.transform = `translate(${joy2.dx}px, ${joy2.dy}px)`;
            }
        });
        canvas.addEventListener('mouseup', () => {
            joy1.active = false; joy1.dx = 0; joy1.dy = 0;
            joy1Div.children[1].style.transform = 'translate(0,0)';
            joy2.active = false; joy2.dx = 0; joy2.dy = 0;
            joy2Div.children[1].style.transform = 'translate(0,0)';
        });

        // --- ИГРОВАЯ ЛОГИКА ---
        function startGame(mode) {
            currentGame = mode;
            menu.style.display = 'none';
            exitBtn.style.display = 'flex';
            joy1Div.style.display = 'block';
            score1Div.style.display = 'block';
            
            if (gMode === 2) {
                joy2Div.style.display = 'block';
                score2Div.style.display = 'block';
            } else {
                joy2Div.style.display = 'none';
                score2Div.style.display = 'none';
            }
            
            timer = 0;
            p1.x = W/2 - 50; p1.y = H/2; p1.score = 0; p1.carry = null; p1.mutantTimer = 0; p1.honey = 0;
            p2.x = W/2 + 50; p2.y = H/2; p2.score = 0; p2.carry = null; p2.mutantTimer = 0; p2.honey = 0;
            msgBox.classList.remove('show'); msgBox.style.display = 'none';

            if (mode === 1) { speak("Строй дом от Хагги!"); blocks = []; monster = null; }
            if (mode === 2) { speak("Беги от монстра!"); chaser = { x: 100, y: H/2 }; }
            if (mode === 3) { 
                speak("Прятки от Хагги Вагги. Прячьтесь за коробки!"); 
                huggy = { looking: false }; huggyTimer = 0; boxes3 = []; 
                for(let i=0; i<5; i++) { boxes3.push({ x: 100 + Math.random() * (W-200), y: 200 + Math.random() * (H-400) }); } 
            }
            if (mode === 4) { speak("Лечи животных. Бегите к ним!"); animals = []; }
            if (mode === 5) { speak("Лови вкусное. Не лови гадость!"); foods = []; }
            if (mode === 6) { speak("Закажите еду! Подойдите к телефону."); orders = []; delivery = []; phone = {x: W/2, y: 100}; }
            if (mode === 7) { speak("Пейте колу и ловите ботов!"); bots = []; cola = {x: 100, y: 100}; }
            if (mode === 8) { speak("Соберите мед и несите в берлогу!"); coins = []; home = {x: W/2, y: H-150, level: 0}; }
        }

        function exitGame() {
            currentGame = null;
            menu.style.display = 'flex';
            exitBtn.style.display = 'none';
            joy1Div.style.display = 'none'; joy2Div.style.display = 'none';
            score1Div.style.display = 'none'; score2Div.style.display = 'none';
            msgBox.classList.remove('show'); msgBox.style.display = 'none';
            window.speechSynthesis.cancel();
        }

        function showMsg(text) {
            msgText.innerHTML = text;
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.classList.add('show'), 10);
            speak(text.replace(/<br>/g, ' '));
            exitBtn.style.display = 'none';
            joy1Div.style.display = 'none'; joy2Div.style.display = 'none';
            score1Div.style.display = 'none'; score2Div.style.display = 'none';
            currentGame = null;
        }

        function loop() {
            if (currentGame !== null) {
                update();
                draw();
            }
            requestAnimationFrame(loop);
        }

        function update() {
            timer++;
            
            p1.vx = joy1.dx / 40 * 4; p1.vy = joy1.dy / 40 * 4;
            p2.vx = joy2.dx / 40 * 4; p2.vy = joy2.dy / 40 * 4;
            
            updatePlayer(p1);
            if (gMode === 2) updatePlayer(p2);

            if (currentGame === 1) updateMode1();
            if (currentGame === 2) updateMode2();
            if (currentGame === 3) updateMode3();
            if (currentGame === 4) updateMode4();
            if (currentGame === 5) updateMode5();
            if (currentGame === 6) updateMode6();
            if (currentGame === 7) updateMode7();
            if (currentGame === 8) updateMode8();
            
            score1Div.innerText = "P1: " + (currentGame === 8 ? p1.honey : p1.score);
            score2Div.innerText = "P2: " + (currentGame === 8 ? p2.honey : p2.score);
        }

        function updatePlayer(p) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 20) p.x = 20; if (p.x > W-20) p.x = W-20;
            if (p.y < 20) p.y = 20; if (p.y > H-20) p.y = H-20;
            if (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) p.legSwing = (p.legSwing + 0.3) % (Math.PI * 2);
            p.angle = Math.atan2(p.vy, p.vx);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            if (currentGame === 1) drawMode1();
            if (currentGame === 2) drawMode2();
            if (currentGame === 3) drawMode3();
            if (currentGame === 4) drawMode4();
            if (currentGame === 5) drawMode5();
            if (currentGame === 6) drawMode6();
            if (currentGame === 7) drawMode7();
            if (currentGame === 8) drawMode8();
            
            if (gMode === 2) drawPlayer(p2);
            drawPlayer(p1);
        }

        function drawPlayer(p) {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(p.x, p.y + 25, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.save(); ctx.translate(p.x, p.y);
            if (p.vx !== 0 || p.vy !== 0) ctx.rotate(p.angle + Math.PI/2);
            
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-15, 10, 12, 20 + (Math.abs(p.vx)>0.1 ? Math.sin(p.legSwing)*5 : 0));
            ctx.fillRect(3, 10, 12, 20 - (Math.abs(p.vx)>0.1 ? Math.sin(p.legSwing)*5 : 0));
            
            if (p.mutantTimer > 0) ctx.fillStyle = '#9b59b6'; else ctx.fillStyle = p.color;
            ctx.fillRect(-20, -15, 40, 35);
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-20, 10, 40, 10); 
            
            ctx.fillStyle = '#f1c27f';
            ctx.fillRect(-25, -10, 5, 15); ctx.fillRect(20, -10, 5, 15);
            
            ctx.fillStyle = '#f1c27f';
            ctx.beginPath(); ctx.arc(0, -25, 18, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-6, -28, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -28, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(-6, -28, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -28, 2, 0, Math.PI * 2); ctx.fill();
            
            ctx.strokeStyle = 'black'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, -20, 8, 0, Math.PI); ctx.stroke();
            ctx.restore();
        }

        // --- РЕЖИМ 1: Дом от Хагги ---
        let blocks = [], monster = null;
        function updateMode1() {
            if (timer === 1) speak("Строй стены!");
            if (timer > 600 && !monster) { monster = { x: -100, y: H/2, size: 100 }; speak("Хагги Вагги идет!"); }
            if (monster) {
                let blocked = false;
                blocks.forEach(b => {
                    if (monster.x > b.x - 50 && monster.x < b.x + 50 && monster.y > b.y - 40 && monster.y < b.y + 40) {
                        b.health -= 1; blocked = true;
                        if (b.health <= 0) blocks.splice(blocks.indexOf(b), 1);
                    }
                });
                if(!blocked) monster.x += 1.5;
                if (monster.x > W + 100) showMsg('🎉 Победа!<br>Хагги не достал вас!');
                if (Math.hypot(monster.x - p1.x, monster.y - p1.y) < 60 || (gMode === 2 && Math.hypot(monster.x - p2.x, monster.y - p2.y) < 60)) showMsg('💀 Проиграл!<br>Хагги съел вас!');
            }
            if (joy1.active && timer % 10 === 0) blocks.push({x: p1.x, y: p1.y, health: 3});
            if (gMode === 2 && joy2.active && timer % 10 === 0) blocks.push({x: p2.x, y: p2.y, health: 3});
        }
        function drawMode1() {
            let grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#87CEEB'); grad.addColorStop(0.7, '#2ecc71'); grad.addColorStop(1, '#27ae60');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(W*0.2, 100, 30, 0, Math.PI*2); ctx.arc(W*0.2+30, 100, 40, 0, Math.PI*2); ctx.arc(W*0.2+60, 100, 30, 0, Math.PI*2); ctx.fill();
            
            blocks.forEach(b => {
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(b.x-18, b.y-13, 40, 30);
                ctx.fillStyle = '#e67e22'; ctx.fillRect(b.x-20, b.y-15, 40, 30);
                ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(b.x-20, b.y-15, 40, 30);
            });
            if (monster) {
                ctx.fillStyle = '#2a36b1'; ctx.fillRect(monster.x-40, monster.y-60, 80, 120);
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(monster.x-20, monster.y-40, 15, 0, Math.PI*2); ctx.arc(monster.x+20, monster.y-40, 15, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(monster.x-20, monster.y-40, 6, 0, Math.PI*2); ctx.arc(monster.x+20, monster.y-40, 6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#d50000'; ctx.beginPath(); ctx.moveTo(monster.x-30, monster.y); ctx.quadraticCurveTo(monster.x, monster.y+40, monster.x+30, monster.y); ctx.quadraticCurveTo(monster.x, monster.y+20, monster.x-30, monster.y); ctx.fill();
            }
        }

        // --- РЕЖИМ 2: Убеги ---
        let chaser = { x: 100, y: H/2 };
        function updateMode2() {
            if (timer === 1) speak("Беги!");
            let avgX = (p1.x + p2.x)/2, avgY = (p1.y + p2.y)/2;
            if (gMode === 1) { avgX = p1.x; avgY = p1.y; }
            chaser.x += (avgX - chaser.x) * 0.01; chaser.y += (avgY - chaser.y) * 0.01;
            if (timer > 3600) showMsg('🎉 Вы убежали!<br>Ничего не получили!');
            if (Math.hypot(chaser.x - p1.x, chaser.y - p1.y) < 50 || (gMode === 2 && Math.hypot(chaser.x - p2.x, chaser.y - p2.y) < 50)) showMsg('💀 Тебя поймали!');
        }
        function drawMode2() {
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0,0,W,H);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 5; ctx.setLineDash([30, 20]); ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(chaser.x, chaser.y + 30, 30, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.font = '60px Arial'; ctx.textAlign = 'center'; ctx.fillText('👻', chaser.x, chaser.y);
        }

        // --- РЕЖИМ 3: Прятки ---
        let huggy = { looking: false }, huggyTimer = 0, boxes3 = [];
        function updateMode3() {
            if(p1.y < 100 || (gMode === 2 && p2.y < 100)) { showMsg('🎉 Вы сбежали<br>от Хагги!'); return; }
            huggyTimer++;
            if (huggyTimer > 150) { huggy.looking = !huggy.looking; huggyTimer = 0; if(huggy.looking) speak("Хагги смотрит! Прячьтесь!"); else speak("Идите!"); }
            if (huggy.looking) {
                let isHidden1 = false, isHidden2 = !gMode === 2;
                for(let b of boxes3) {
                    if (Math.hypot(b.x - p1.x, b.y - p1.y) < 60) isHidden1 = true;
                    if (gMode === 2 && Math.hypot(b.x - p2.x, b.y - p2.y) < 60) isHidden2 = true;
                }
                if (!isHidden1 || (gMode === 2 && !isHidden2)) showMsg('💀 Хагги Вагги<br>вас увидел!');
            }
        }
        function drawMode3() {
            ctx.fillStyle = huggy.looking ? '#4a0000' : '#2c3e50'; ctx.fillRect(0,0,W,H);
            if(huggy.looking) { let grad = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H); grad.addColorStop(0, 'rgba(255,0,0,0.4)'); grad.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = grad; ctx.fillRect(0,0,W,H); }
            ctx.font = '60px Arial'; ctx.textAlign = 'center';
            boxes3.forEach(b => { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(b.x, b.y + 25, 30, 0, Math.PI*2); ctx.fill(); ctx.fillText('📦', b.x, b.y); });
            ctx.fillStyle = '#2a36b1'; ctx.fillRect(W/2-40, -60, 80, 120);
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(W/2-20, 10, 15, 0, Math.PI*2); ctx.arc(W/2+20, 10, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(W/2-20, 10, 6, 0, Math.PI*2); ctx.arc(W/2+20, 10, 6, 0, Math.PI*2); ctx.fill();
        }

        // --- РЕЖИМ 4: Больница ---
        let animals = []; const animalTypes = ['🐶', '🐱', '🐰', '🐹', '🐻'];
        function updateMode4() {
            if (timer === 1) speak("Лечи животных!");
            if (timer % 100 === 0 && animals.length < 5) { animals.push({ x: 100 + Math.random() * (W-200), y: 200 + Math.random() * (H-250), sick: true, type: animalTypes[Math.floor(Math.random() * animalTypes.length)] }); }
            animals.forEach(a => {
                if (a.sick && (Math.hypot(p1.x - a.x, p1.y - a.y) < 50 || (gMode === 2 && Math.hypot(p2.x - a.x, p2.y - a.y) < 50))) {
                    a.sick = false; p1.score++; speak("Молодец! Животное здорово!");
                    setTimeout(() => { const idx = animals.indexOf(a); if(idx > -1) animals.splice(idx, 1); }, 2000);
                }
            });
        }
        function drawMode4() {
            ctx.fillStyle = '#ecf0f1'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(0, H-50, W, 50);
            ctx.fillStyle = '#e74c3c'; ctx.font = '40px Arial'; for(let i=0; i<5; i++) ctx.fillText('✚', 100 + i*(W/5), 100);
            animals.forEach(a => {
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.ellipse(a.x, a.y + 25, 25, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.font = '50px Arial'; ctx.textAlign = 'center'; ctx.fillText(a.type, a.x, a.y);
                if(a.sick) { ctx.font = '30px Arial'; ctx.fillText('🤢', a.x + 30, a.y - 20); } else { ctx.font = '30px Arial'; ctx.fillText('❤️', a.x + 30, a.y - 20); }
            });
        }

        // --- РЕЖИМ 5: Еда ---
        let foods = [];
        function updateMode5() {
            if (timer === 1) speak("Лови вкусное!");
            if (timer % 40 === 0) foods.push({ x: Math.random() * W, y: -50, type: Math.random() > 0.5 ? 'good' : 'bad' });
            foods.forEach(f => {
                f.y += 5;
                if (Math.hypot(f.x - p1.x, f.y - p1.y) < 40 || (gMode === 2 && Math.hypot(f.x - p2.x, f.y - p2.y) < 40)) {
                    if (f.type === 'bad') showMsg('🤢 Фу! Надо в туалет!');
                    else { p1.score++; speak("Вкусно!"); }
                    foods.splice(foods.indexOf(f), 1);
                }
                if (f.y > H) foods.splice(foods.indexOf(f), 1);
            });
        }
        function drawMode5() {
            let grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0, '#ff9a9e'); grad.addColorStop(1, '#fecfef');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            foods.forEach(f => { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText(f.type === 'good' ? '🍕' : '🤢', f.x, f.y); });
        }

        // --- РЕЖИМ 6: Заказ Еды ---
        let phone = {}, orders = [], delivery = [];
        function updateMode6() {
            if (timer === 1) speak("Подойдите к телефону и закажите еду!");
            if (Math.hypot(p1.x - phone.x, p1.y - phone.y) < 50 && timer % 100 === 0) {
                orders.push(['🍕','🍔','🌮','🍩'][Math.floor(Math.random()*4)]);
                speak("Заказ принят!");
            }
            delivery.forEach(d => {
                if (Math.hypot(p1.x - d.x, p1.y - d.y) < 50) { p1.carry = d.t; delivery.splice(delivery.indexOf(d), 1); speak("Взял еду!"); p1.score++; }
                if (gMode === 2 && Math.hypot(p2.x - d.x, p2.y - d.y) < 50) { p2.carry = d.t; delivery.splice(delivery.indexOf(d), 1); speak("Взял еду!"); p2.score++; }
            });
        }
        function drawMode6() {
            ctx.fillStyle = '#fff5cc'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#e67e22'; ctx.fillRect(0, H-100, W, 100);
            ctx.font = '20px Arial'; ctx.fillStyle = 'black'; ctx.textAlign = 'center';
            ctx.fillText('Подойдите к телефону 📞', W/2, H-40);
            ctx.font = '60px Arial'; ctx.fillText('📞', phone.x, phone.y);
            if (orders.length > 0 && timer % 150 === 0) { delivery.push({x: -50, y: 200, type: orders[0]}); orders.shift(); }
            delivery.forEach(d => { d.x += 2; ctx.font = '50px Arial'; ctx.fillText('🛵', d.x, d.y); ctx.font = '30px Arial'; ctx.fillText(d.t, d.x, d.y-40); });
            if (p1.carry) { ctx.font = '30px Arial'; ctx.fillText(p1.carry, p1.x, p1.y-40); }
            if (p2.carry) { ctx.font = '30px Arial'; ctx.fillText(p2.carry, p2.x, p2.y-40); }
        }

        // --- РЕЖИМ 7: Мутант Кола ---
        let cola = {}, bots = [];
        function updateMode7() {
            if (timer === 1) speak("Пейте колу и ловите ботов!");
            if (timer % 100 === 0) cola = {x: Math.random()*W, y: Math.random()*H};
            if (timer % 50 === 0 && bots.length < 5) bots.push({x: Math.random()*W, y: Math.random()*H, vx: Math.random()*2-1, vy: Math.random()*2-1});
            
            if (Math.hypot(p1.x - cola.x, p1.y - cola.y) < 50) { p1.mutantTimer = 300; cola = {}; speak("Мутант!"); }
            if (gMode === 2 && Math.hypot(p2.x - cola.x, p2.y - cola.y) < 50) { p2.mutantTimer = 300; cola = {}; speak("Мутант!"); }
            
            bots.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > W) b.vx *= -1;
                if (b.y < 0 || b.y > H) b.vy *= -1;
                if (p1.mutantTimer > 0 && Math.hypot(p1.x - b.x, p1.y - b.y) < 50) { bots.splice(bots.indexOf(b), 1); p1.score++; speak("Поймал!"); }
                if (gMode === 2 && p2.mutantTimer > 0 && Math.hypot(p2.x - b.x, p2.y - b.y) < 50) { bots.splice(bots.indexOf(b), 1); p2.score++; speak("Поймал!"); }
            });
            if (p1.mutantTimer > 0) p1.mutantTimer--;
            if (p2.mutantTimer > 0) p2.mutantTimer--;
        }
        function drawMode7() {
            ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,W,H);
            if (cola.x) { ctx.font = '60px Arial'; ctx.textAlign = 'center'; ctx.fillText('🥤', cola.x, cola.y); }
            bots.forEach(b => { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText('🤖', b.x, b.y); });
            if (p1.mutantTimer > 0) { ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(p1.x, p1.y, 50, 0, Math.PI*2); ctx.stroke(); }
            if (p2.mutantTimer > 0) { ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(p2.x, p2.y, 50, 0, Math.PI*2); ctx.stroke(); }
        }

        // --- РЕЖИМ 8: Мишка Берлога ---
        let coins = [], home = {};
        function updateMode8() {
            if (timer === 1) speak("Соберите мед и несите в берлогу!");
            if (coins.length < 5 && timer % 100 === 0) coins.push({x: Math.random()*W, y: Math.random()*H});
            coins.forEach(co => {
                if (Math.hypot(p1.x - co.x, p1.y - co.y) < 40) { coins.splice(coins.indexOf(co), 1); p1.carry = '🍯'; speak("Взял!"); }
                if (gMode === 2 && Math.hypot(p2.x - co.x, p2.y - co.y) < 40) { coins.splice(coins.indexOf(co), 1); p2.carry = '🍯'; speak("Взял!"); }
            });
            if (p1.carry && Math.hypot(p1.x - home.x, p1.y - home.y) < 80) { p1.carry = null; p1.honey++; home.level++; speak("Улучшаем берлогу!"); }
            if (gMode === 2 && p2.carry && Math.hypot(p2.x - home.x, p2.y - home.y) < 80) { p2.carry = null; p2.honey++; home.level++; speak("Улучшаем берлогу!"); }
        }
        function drawMode8() {
            let grad = ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#2ecc71');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#27ae60'; ctx.beginPath(); ctx.arc(100, 100, 50, 0, Math.PI*2); ctx.arc(150, 150, 70, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(W-100, 200, 60, 0, Math.PI*2); ctx.arc(W-50, 250, 80, 0, Math.PI*2); ctx.fill();
            coins.forEach(co => { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText('🍯', co.x, co.y); });
            let lv = home.level || 0;
            ctx.font = '20px Arial'; ctx.fillStyle = 'black'; ctx.fillText('Ур. Берлоги: ' + lv, home.x, home.y - 60);
            ctx.font = '80px Arial'; ctx.fillText('🏠', home.x, home.y);
            if (lv > 2) ctx.fillText('🪑', home.x - 40, home.y);
            if (lv > 4) ctx.fillText('🛋️', home.x + 40, home.y);
            if (lv > 6) ctx.fillText('📺', home.x, home.y - 40);
        }

        loop();
    </script>
</body>
</html>
