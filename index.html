function toggleMusic() {

    if(ac.state === 'suspended') ac.resume();
    mOn = !mOn;
    mbtn.innerHTML = mOn ? "🔊" : "🔇";

        if(mInt) clearInterval(mInt);

    bullets.forEach(b => { x.fillStyle='#fff'; x.beginPath(); x.arc(b.x, b.y, 4, 0, 2*Math.PI); x.fill(); });
    x.font='80px Arial'; x.textAlign='center'; x.fillText('🔮', matrix.x, matrix.y);
    x.fillStyle='#e74c3c'; x.fillRect(matrix.x-60, matrix.y-80, 120, 10);
    x.fillStyle='#2ecc71'; x.fillRect(matrix.x-60, matrix.y-80, 120 * (matrix.hp/1000), 10);
}

// Режим 16: Паркур
let parkourBlocks = [], parkourScroll = 0, parkourScore = 0;
function genParkour() { for(let i=0; i<20; i++) parkourBlocks.push({x:Math.random()*W, y:H - i*100, w:80, h:30}); }
function u16() {
    if(t === 1) sp(i18n[currentLang].msgs[15]);
    p1.vy += 0.5; p2.vy += 0.5;
    p1.y += p1.vy; p2.y += p2.vy;
    parkourScroll += 1; parkourScore = Math.floor(parkourScroll / 10);
    parkourBlocks.forEach(b => {
        if(p1.x > b.x-20 && p1.x < b.x+b.w+20 && p1.y > b.y-20 && p1.y < b.y+b.h) { p1.y = b.y-20; p1.vy = 0; p1.vx *= 1.5; }
        if(gMode===2 && p2.x > b.x-20 && p2.x < b.x+b.w+20 && p2.y > b.y-20 && p2.y < b.y+b.h) { p2.y = b.y-20; p2.vy = 0; p2.vx *= 1.5; }
        b.y += 1;
    });
    if(parkourBlocks.length < 20) parkourBlocks.push({x:Math.random()*W, y:-50, w:80, h:30});
    parkourBlocks = parkourBlocks.filter(b => b.y < H + 50);
    if(p1.y > H) { p1.dead = true; sp("Ouch!"); }
    if(gMode===2 && p2.y > H) { p2.dead = true; sp("Ouch!"); }
    checkDead();
}
function d16() {
    x.fillStyle='#87CEEB'; x.fillRect(0,0,W,H);
    parkourBlocks.forEach(b => { x.fillStyle='#7f8c8d'; x.fillRect(b.x, b.y, b.w, b.h); x.fillStyle='#95a5a6'; x.fillRect(b.x, b.y, b.w, 5); x.fillStyle='#000'; x.font='20px Arial'; x.textAlign='center'; x.fillText('🟫', b.x+b.w/2, b.y+b.h/2+5); });
}

// === 7 НОВЫХ МАСШТАБНЫХ ИГР (17-23) ===
// 17: Симулятор Жизни
let lifeHouses=[], lifeCars=[], lifeNPCs=[];
function u17() {
    if(t===1) sp(i18n[currentLang].msgs[16]);
    // Покупка дома
    lifeHouses.forEach(h => {
        if(!p1.dead && !h.bought && Math.hypot(p1.x-h.x, p1.y-h.y) < 60 && p1.money >= 100) { h.bought = true; p1.money -= 100; sp("Куплен дом!"); }
    });
    // Садимся в машину
    lifeCars.forEach(car => {
        if(car.parked && !p1.dead && Math.hypot(p1.x-car.x, p1.y-car.y) < 50) { car.parked = false; p1.inCar = true; sp("Ты в машине!"); }
        if(!car.parked && p1.inCar) { car.x = p1.x; car.y = p1.y; }
    });
    // Заработок
    if(!p1.inCar) p1.money += 0.1;
    // Общение с NPC
    lifeNPCs.forEach(npc => {
        if(!p1.dead && Math.hypot(p1.x-npc.x, p1.y-npc.y) < 50) { npc.text = "Привет!"; } else { npc.text = "..."; }
    });
}
function d17() {
    let g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#87CEEB'); g.addColorStop(1,'#2ecc71'); x.fillStyle=g; x.fillRect(0,0,W,H);
    // Дома
    lifeHouses.forEach(h => { x.fillStyle = h.bought ? '#e67e22' : '#95a5a6'; x.fillRect(h.x-30, h.y-30, 60, 60); x.font='30px Arial'; x.textAlign='center'; x.fillText('🏠', h.x, h.y); });
    // Машины
    lifeCars.forEach(car => { x.font='40px Arial'; x.textAlign='center'; x.fillText('🚗', car.x, car.y); });
    // NPC
    lifeNPCs.forEach(npc => { x.font='30px Arial'; x.textAlign='center'; x.fillText('🧑', npc.x, npc.y); x.font='15px Arial'; x.fillStyle='#000'; x.fillText(npc.text, npc.x, npc.y-30); });
    // Деньги
    x.fillStyle='#000'; x.font='bold 20px Arial'; x.textAlign='left'; x.fillText('💰 ' + Math.floor(p1.money) + '$', 20, 80);
    if(p1.inCar) { x.textAlign='center'; x.fillText('Ты в машине! Выйди, чтобы заработать.', W/2, H-50); }
}

// 18: Питомцы
let pets=[], petFood=[], petHome={};
function u18() {
    if(t===1) sp(i18n[currentLang].msgs[17]);
    // Ловля питомцев
    pets.forEach(p => {
        if(!p.caught && !p1.dead && Math.hypot(p1.x-p.x, p1.y-p.y) < 40) { p.caught = true; p1.carry = p.t; sp("Пойман!"); }
    });
    // Сбор еды
    petFood.forEach(f => {
        if(!p1.dead && Math.hypot(p1.x-f.x, p1.y-f.y) < 30) { p1.carry = '🍖'; petFood.splice(petFood.indexOf(f),1); sp("Еда!"); }
    });
    // Кормежка дома
    if(p1.carry === '🍖' && Math.hypot(p1.x-petHome.x, p1.y-petHome.y) < 80) { p1.carry = null; petHome.level++; p1.score++; sp("Дом прокачан!"); }
}
function d18() {
    let g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#87CEEB'); g.addColorStop(1,'#2ecc71'); x.fillStyle=g; x.fillRect(0,0,W,H);
    pets.forEach(p => { if(!p.caught) { x.font='40px Arial'; x.textAlign='center'; x.fillText(p.t, p.x, p.y); } });
    petFood.forEach(f => { x.font='30px Arial'; x.textAlign='center'; x.fillText('🍖', f.x, f.y); });
    let lv = petHome.level || 0; x.font='80px Arial'; x.textAlign='center'; x.fillText('🏠', petHome.x, petHome.y);
    if(lv > 2) x.fillText('🪑', petHome.x-40, petHome.y);
    if(lv > 4) x.fillText('🛋️', petHome.x+40, petHome.y);
    if(p1.carry) { x.font='30px Arial'; x.textAlign='center'; x.fillText(p1.carry, p1.x, p1.y-40); }
}

// 19: Стройка и Работа
let buildBlocks=[], buildJobs=[];
function u19() {
    if(t===1) sp(i18n[currentLang].msgs[18]);
    // Берем работу
    buildJobs.forEach(j => {
        if(!p1.dead && Math.hypot(p1.x-j.x, p1.y-j.y) < 50 && !p1.carry) { p1.carry = '🧱'; sp("Взял кирпич!"); }
    });
    // Строим
    if(p1.carry === '🧱' && t%20 === 0) { buildBlocks.push({x:p1.x, y:p1.y}); p1.carry = null; p1.money += 10; p1.score++; sp("Построено!"); }
}
function d19() {
    x.fillStyle='#34495e'; x.fillRect(0,0,W,H);
    x.fillStyle='#e67e22'; x.fillRect(0, H-100, W, 100);
    buildJobs.forEach(j => { x.font='40px Arial'; x.textAlign='center'; x.fillText('🏗️', j.x, j.y); });
    buildBlocks.forEach(b => { x.fillStyle='#e74c3c'; x.fillRect(b.x-20, b.y-20, 40, 40); });
    x.fillStyle='#fff'; x.font='bold 20px Arial'; x.textAlign='left'; x.fillText('💰 ' + Math.floor(p1.money) + '$', 20, 80);
    if(p1.carry) { x.font='30px Arial'; x.textAlign='center'; x.fillText(p1.carry, p1.x, p1.y-40); }
}

// 20: Аниме RPG (One Piece)
let devilFruits=[], animeBoss={};
function u20() {
    if(t===1) sp(i18n[currentLang].msgs[19]);
    // Сбор фруктов
    devilFruits.forEach(f => {
        if(!f.taken && !p1.dead && Math.hypot(p1.x-f.x, p1.y-f.y) < 40) { f.taken = true; p1.lvl++; p1.hp += 20; sp("Фрукт силы! Лвл "+p1.lvl); }
    });
    // Атака босса
    if(!p1.dead && Math.hypot(p1.x-animeBoss.x, p1.y-animeBoss.y) < 80 && t%30 === 0) {
        animeBoss.hp -= p1.lvl * 5; sp("Удар по боссу!");
        // Босс бьет в ответ
        p1.hp -= 10;
        if(p1.hp <= 0) p1.dead = true;
    }
    if(animeBoss.hp <= 0) { showMsg(i18n[currentLang].win[0]); }
    checkDead();
}
function d20() {
    x.fillStyle='#1a1a2e'; x.fillRect(0,0,W,H);
    devilFruits.forEach(f => { if(!f.taken) { x.font='40px Arial'; x.textAlign='center'; x.fillText('🍈', f.x, f.y); } });
    // Босс
    x.font='80px Arial'; x.textAlign='center'; x.fillText('🦑', animeBoss.x, animeBoss.y);
    x.fillStyle='#e74c3c'; x.fillRect(animeBoss.x-60, animeBoss.y-80, 120, 10);
    x.fillStyle='#2ecc71'; x.fillRect(animeBoss.x-60, animeBoss.y-80, 120 * (animeBoss.hp/animeBoss.maxHp), 10);
    // Игрок
    x.fillStyle='#fff'; x.font='bold 20px Arial'; x.textAlign='left'; x.fillText('Lvl: ' + p1.lvl + ' | HP: ' + p1.hp, 20, 80);
}

// 21: Арена Шар (Отбивание)
let arenaBall={};
function u21() {
    if(t===1) sp(i18n[currentLang].msgs[20]);
    // Шар летит к игроку
    let a = Math.atan2(p1.y - arenaBall.y, p1.x - arenaBall.x);
    arenaBall.vx = Math.cos(a) * 4; arenaBall.vy = Math.sin(a) * 4;
    arenaBall.x += arenaBall.vx; arenaBall.y += arenaBall.vy;
    // Рывок (суперспособность)
    if(j1.active && p1.boost === 0) { p1.boost = 30; sp("Рывок!"); }
    // Отбивание
    if(!p1.dead && Math.hypot(p1.x-arenaBall.x, p1.y-arenaBall.y) < 50) {
        if(p1.boost > 0) { // Если есть буст - отбиваем
            arenaBall.x -= arenaBall.vx * 5; arenaBall.y -= arenaBall.vy * 5;
            p1.score++; sp("Отбил!");
        } else { // Если нет буста - урон
            p1.hp -= 20;
            if(p1.hp <= 0) p1.dead = true;
        }
    }
    checkDead();
}
function d21() {
    x.fillStyle='#2c3e50'; x.fillRect(0,0,W,H);
    x.strokeStyle='#f1c40f'; x.lineWidth=5; x.beginPath(); x.arc(W/2, H/2, Math.min(W,H)/3, 0, 2*Math.PI); x.stroke();
    x.fillStyle='#e74c3c'; x.beginPath(); x.arc(arenaBall.x, arenaBall.y, 20, 0, 2*Math.PI); x.fill();
    x.fillStyle='#fff'; x.font='bold 20px Arial'; x.textAlign='left'; x.fillText('HP: ' + p1.hp + ' | Score: ' + p1.score, 20, 80);
}

// 22: RPG Арена (Волны врагов)
let rpgEnemies=[], rpgSpawnTimer=0, rpgWave=1;
function u22() {
    if(t===1) sp(i18n[currentLang].msgs[21]);
    rpgSpawnTimer++;
    if(rpgSpawnTimer > 300) { rpgWave++; rpgSpawnTimer = 0; sp("Волна " + rpgWave + "!"); }
    if(t % (60 - rpgWave) === 0 && rpgEnemies.length < 5 + rpgWave) { rpgEnemies.push({x:Math.random()<0.5?0:W, y:Math.random()*H, hp:10+rpgWave*5, maxHp:10+rpgWave*5}); }
    
    rpgEnemies.forEach(e => {
        e.x += (p1.x - e.x) * 0.01; e.y += (p1.y - e.y) * 0.01;
        // Атака игрока
        if(!p1.dead && Math.hypot(p1.x-e.x, p1.y-e.y) < 60 && t%20 === 0) {
            e.hp -= 5 + p1.lvl * 2;
            if(e.hp <= 0) { rpgEnemies.splice(rpgEnemies.indexOf(e),1); p1.score++; p1.lvl++; p1.hp += 10; sp("Уровень повышен!"); }
        }
        // Враг атакует
        if(!p1.dead && Math.hypot(p1.x-e.x, p1.y-e.y) < 50 && t%30 === 0) {
            p1.hp -= 5;
            if(p1.hp <= 0) p1.dead = true;
        }
    });
    checkDead();
}
function d22() {
    x.fillStyle='#1a1a2e'; x.fillRect(0,0,W,H);
    x.strokeStyle='#e74c3c'; x.lineWidth=5; x.beginPath(); x.arc(W/2, H/2, Math.min(W,H)/3, 0, 2*Math.PI); x.stroke();
    rpgEnemies.forEach(e => { x.font='40px Arial'; x.textAlign='center'; x.fillText('👾', e.x, e.y); x.fillStyle='#e74c3c'; x.fillRect(e.x-20, e.y-30, 40 * (e.hp/e.maxHp), 5); });
    x.fillStyle='#fff'; x.font='bold 20px Arial'; x.textAlign='left'; x.fillText('Lvl: ' + p1.lvl + ' | HP: ' + p1.hp + ' | Wave: ' + rpgWave, 20, 80);
}

// 23: Полоса Препятствий (Рандомная)
let obstacles=[], obstacleTime=0;
function genObstacles() { obstacles = []; for(let i=0; i<20; i++) obstacles.push({x:i*200, y:Math.random()*H, type:Math.random()>0.5?'spike':'block'}); }
function u23() {
    if(t===1) sp(i18n[currentLang].msgs[22]);
    obstacleTime += 1/60; // Таймер
    p1.vy += 0.5; p2.vy += 0.5; p1.y += p1.vy; p2.y += p2.vy;
    obstacles.forEach(o => {
        o.x -= 3; // Движение препятствий
        if(o.type === 'block') {
            if(p1.x > o.x-20 && p1.x < o.x+20 && p1.y > o.y-20 && p1.y < o.y+20) { p1.y = o.y-20; p1.vy = 0; }
            if(gMode===2 && p2.x > o.x-20 && p2.x < o.x+20 && p2.y > o.y-20 && p2.y < o.y+20) { p2.y = o.y-20; p2.vy = 0; }
        } else if(o.type === 'spike') {
            if(!p1.dead && Math.hypot(p1.x-o.x, p1.y-o.y) < 30) { p1.dead = true; sp("Ой!"); }
            if(gMode===2 && !p2.dead && Math.hypot(p2.x-o.x, p2.y-o.y) < 30) { p2.dead = true; sp("Ой!"); }
        }
    });
    if(obstacles[obstacles.length-1].x < 0) { showMsg(i18n[currentLang].win[0]); }
    if(obstacleTime > 60) { showMsg(i18n[currentLang].lose); }
    checkDead();
}
function d23() {
    x.fillStyle='#87CEEB'; x.fillRect(0,0,W,H);
    x.fillStyle='#7f8c8d'; x.fillRect(0, H-50, W, 50); // Земля
    obstacles.forEach(o => {
        if(o.type === 'block') { x.fillStyle='#7f8c8d'; x.fillRect(o.x-20, o.y-20, 40, 40); }
        else { x.fillStyle='#e74c3c'; x.beginPath(); x.moveTo(o.x, o.y-20); x.lineTo(o.x-15, o.y+10); x.lineTo(o.x+15, o.y+10); x.fill(); }
    });
    x.fillStyle='#000'; x.font='bold 20px Arial'; x.textAlign='center'; x.fillText('Время: ' + Math.floor(60-obstacleTime) + 'с', W/2, 50);
}

initEditor();
loop();
</script>
