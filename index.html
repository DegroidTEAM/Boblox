<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Боблокс</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;overflow:hidden;font-family:Arial,sans-serif;user-select:none;touch-action:none}
#gc{display:block;width:100vw;height:100vh}
#m{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at top,#4a00e0,#8e2de2,#00c6ff);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;z-index:10;padding:20px;overflow-y:auto}
.t{color:#fff;font-size:34px;font-weight:900;margin-top:20px;margin-bottom:15px;text-shadow:3px 3px 0 rgba(0,0,0,.4);text-align:center}
.bc{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px;padding-bottom:40px}
.gb{background:#fff;border:none;border-radius:20px;padding:15px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s;display:flex;align-items:center}
.gb:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.bi{font-size:40px;margin-right:15px}.bt{color:#2c3e50;font-weight:800;font-size:18px}
#ex{position:absolute;top:15px;right:15px;background:rgba(231,76,60,.9);color:#fff;border:2px solid #fff;border-radius:50%;width:45px;height:45px;font-size:22px;z-index:15;display:none;align-items:center;justify-content:center}
#mb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fff;color:#2c3e50;padding:30px 40px;border-radius:25px;text-align:center;z-index:20;display:none;box-shadow:0 15px 40px rgba(0,0,0,.5);border:4px solid #8e2de2;transition:transform .3s cubic-bezier(.18,.89,.32,1.28);width:85%;max-width:320px}
#mb.s{transform:translate(-50%,-50%) scale(1)}
#mb h1{font-size:28px;margin-bottom:20px;font-weight:900}
#mb button{background:#8e2de2;color:#fff;border:none;padding:12px 30px;font-size:18px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #6a1b9a}
.toggle{display:flex;background:#fff;border-radius:20px;padding:5px;margin-bottom:10px;justify-content:center}
.tb{padding:10px 20px;font-size:18px;font-weight:700;color:#2c3e50;background:none;border:none;border-radius:15px}.ta{background:#8e2de2;color:#fff!important}
.jb{position:absolute;bottom:30px;width:120px;height:120px;z-index:5;display:none;pointer-events:none}
.jbb{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.4);position:absolute}
.jbs{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.8);position:absolute;top:30px;left:30px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#j1{left:30px}#j2{right:30px}
#st1,#st2{position:absolute;top:15px;font-size:20px;font-weight:700;color:#fff;z-index:5;display:none;text-shadow:1px 1px 2px #000}
#st1{left:80px}#st2{right:80px}
#mbtn{position:absolute;top:15px;left:15px;background:rgba(0,0,0,.6);color:#fff;border:2px solid #fff;border-radius:50%;width:45px;height:45px;font-size:20px;z-index:15;display:flex;align-items:center;justify-content:center}
#rotHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px;border-radius:15px;z-index:30;display:none;text-align:center}
</style>
</head>
<body>
<button id="mbtn" onclick="toggleMusic()">🔇</button>
<div id="m">
<div class="t">🎮 БОБЛОКС</div>
<div class="toggle"><button class="tb ta" onclick="setMode(1)">1 ИГРОК</button><button class="tb" onclick="setMode(2)">2 ИГРОКА</button></div>
<div class="bc">
<button class="gb" onclick="startGame(1)"><div class="bi">🏠</div><div class="bt">Дом от Хагги</div></button>
<button class="gb" onclick="startGame(2)"><div class="bi">🏃</div><div class="bt">Убеги от монстра</div></button>
<button class="gb" onclick="startGame(3)"><div class="bi">🙈</div><div class="bt">Прятки Хагги</div></button>
<button class="gb" onclick="startGame(4)"><div class="bi">🏥</div><div class="bt">Больница</div></button>
<button class="gb" onclick="startGame(5)"><div class="bi">🍔</div><div class="bt">Вкусно или Туалет</div></button>
<button class="gb" onclick="startGame(6)"><div class="bi">🛵</div><div class="bt">Ресторан Еды</div></button>
<button class="gb" onclick="startGame(7)"><div class="bi">🥤</div><div class="bt">Мутант Кола</div></button>
<button class="gb" onclick="startGame(8)"><div class="bi">🐻</div><div class="bt">Мишка Берлога</div></button>
</div></div>
<div id="st1">P1: 0</div><div id="st2">P2: 0</div>
<button id="ex" onclick="exitGame()">✖</button>
<canvas id="gc"></canvas>
<div id="j1" class="jb"><div class="jbb"></div><div class="jbs"></div></div>
<div id="j2" class="jb"><div class="jbb"></div><div class="jbs"></div></div>
<div id="mb"><h1 id="mt"></h1><button onclick="exitGame()">В МЕНЮ</button></div>
<div id="rotHint">Поверни телефон вертикально! ⬆️<br><button onclick="document.getElementById('rotHint').style.display='none'">ОК</button></div>

<script>
const c=document.getElementById('gc'),x=c.getContext('2d'),m=document.getElementById('m'),ex=document.getElementById('ex'),mb=document.getElementById('mb'),mt=document.getElementById('mt'),j1d=document.getElementById('j1'),j2d=document.getElementById('j2'),st1=document.getElementById('st1'),st2=document.getElementById('st2'),mbtn=document.getElementById('mbtn'),rotHint=document.getElementById('rotHint');
let W,H,cg=null,t=0,gMode=1;
let p1={x:100,y:0,vx:0,vy:0,ls:0,a:0,mt:0,score:0,carry:null,honey:0},p2={x:200,y:0,vx:0,vy:0,ls:0,a:0,mt:0,score:0,carry:null,honey:0};
let j1={a:false,bx:90,by:0,dx:0,dy:0,id:null},j2={a:false,bx:0,by:0,dx:0,dy:0,id:null};

// --- МУЗЫКА ---
let ac=null,mOn=false,mInt=null,mStep=0;
function initA(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}
function pN(f,d,t='square',v=.1){if(!ac||!mOn)return;let o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function pNoise(d,v=.05){if(!ac||!mOn)return;const bs=ac.sampleRate*d,b=ac.createBuffer(1,bs,ac.sampleRate),dt=b.getChannelData(0);for(let i=0;i<bs;i++)dt[i]=Math.random()*2-1;const n=ac.createBufferSource();n.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1000;const g=ac.createGain();g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);n.connect(f);f.connect(g);g.connect(ac.destination);n.start();n.stop(ac.currentTime+d)}
const mel=[262,330,392,523,494,392,330,262];
function mTick(){if(!mOn)return;pNoise(.05,.03);let s=mStep%8;if(s===0||s===4)pN(60,.15,'sine',.3);if(s===2||s===6)pNoise(.1,.1);pN(mel[s],.2,'square',.08);if(s%2===0)pN(mel[s]/2,.3,'triangle',.06);mStep++}
function toggleMusic(){initA();if(ac.state==='suspended')ac.resume();mOn=!mOn;mbtn.innerHTML=mOn?"🔊":"🔇";mbtn.style.background=mOn?"rgba(46,204,113,.9)":"rgba(0,0,0,.6)";if(mOn){if(mInt)clearInterval(mInt);mInt=setInterval(mTick,200)}else{clearInterval(mInt)}}

// --- ЭКРАН И ПОВОРОТ ---
function rs(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;j1.bx=90;j1.by=H-90;j2.bx=W-90;j2.by=H-90;checkOrient()}
function checkOrient(){if(innerWidth>innerHeight&&cg!==null){rotHint.style.display='block'}else{rotHint.style.display='none'}}
addEventListener('resize',rs);rs();
screen.orientation.addEventListener('change',checkOrient);

// --- ОЗВУЧКА ---
function sp(v){try{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(v);u.lang='ru-RU';u.rate=1.1;speechSynthesis.speak(u)}}catch(e){}}

// --- УПРАВЛЕНИЕ ---
function setMode(n){gMode=n;document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('ta',i===n-1))}
function hTS(e){e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){let t=e.changedTouches[i];if(t.clientX<W/2&&j1.id===null){j1.id=t.identifier;j1.a=true;j1.dx=t.clientX-j1.bx;j1.dy=t.clientY-j1.by;let d=Math.hypot(j1.dx,j1.dy);if(d>40){j1.dx=(j1.dx/d)*40;j1.dy=(j1.dy/d)*40}j1d.children[1].style.transform=`translate(${j1.dx}px,${j1.dy}px)`}else if(t.clientX>=W/2&&j2.id===null&&gMode===2){j2.id=t.identifier;j2.a=true;j2.dx=t.clientX-j2.bx;j2.dy=t.clientY-j2.by;let d=Math.hypot(j2.dx,j2.dy);if(d>40){j2.dx=(j2.dx/d)*40;j2.dy=(j2.dy/d)*40}j2d.children[1].style.transform=`translate(${j2.dx}px,${j2.dy}px)`}}}
function hTM(e){e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){let t=e.changedTouches[i];if(t.identifier===j1.id){j1.dx=t.clientX-j1.bx;j1.dy=t.clientY-j1.by;let d=Math.hypot(j1.dx,j1.dy);if(d>40){j1.dx=(j1.dx/d)*40;j1.dy=(j1.dy/d)*40}j1d.children[1].style.transform=`translate(${j1.dx}px,${j1.dy}px)`}else if(t.identifier===j2.id){j2.dx=t.clientX-j2.bx;j2.dy=t.clientY-j2.by;let d=Math.hypot(j2.dx,j2.dy);if(d>40){j2.dx=(j2.dx/d)*40;j2.dy=(j2.dy/d)*40}j2d.children[1].style.transform=`translate(${j2.dx}px,${j2.dy}px)`}}}
function hTE(e){e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){let t=e.changedTouches[i];if(t.identifier===j1.id){j1.a=false;j1.dx=0;j1.dy=0;j1.id=null;j1d.children[1].style.transform='translate(0,0)'}else if(t.identifier===j2.id){j2.a=false;j2.dx=0;j2.dy=0;j2.id=null;j2d.children[1].style.transform='translate(0,0)'}}}
c.addEventListener('touchstart',hTS,{passive:false});c.addEventListener('touchmove',hTM,{passive:false});c.addEventListener('touchend',hTE,{passive:false});c.addEventListener('touchcancel',hTE,{passive:false});
c.addEventListener('mousedown',e=>{initA();if(ac.state==='suspended')ac.resume();if(e.clientX<W/2){j1.a=true;j1.dx=e.clientX-j1.bx;j1.dy=e.clientY-j1.by;let d=Math.hypot(j1.dx,j1.dy);if(d>40){j1.dx=(j1.dx/d)*40;j1.dy=(j1.dy/d)*40}j1d.children[1].style.transform=`translate(${j1.dx}px,${j1.dy}px)`}else if(gMode===2){j2.a=true;j2.dx=e.clientX-j2.bx;j2.dy=e.clientY-j2.by;let d=Math.hypot(j2.dx,j2.dy);if(d>40){j2.dx=(j2.dx/d)*40;j2.dy=(j2.dy/d)*40}j2d.children[1].style.transform=`translate(${j2.dx}px,${j2.dy}px)`}});
c.addEventListener('mousemove',e=>{if(j1.a){j1.dx=e.clientX-j1.bx;j1.dy=e.clientY-j1.by;let d=Math.hypot(j1.dx,j1.dy);if(d>40){j1.dx=(j1.dx/d)*40;j1.dy=(j1.dy/d)*40}j1d.children[1].style.transform=`translate(${j1.dx}px,${j1.dy}px)`}else if(j2.a){j2.dx=e.clientX-j2.bx;j2.dy=e.clientY-j2.by;let d=Math.hypot(j2.dx,j2.dy);if(d>40){j2.dx=(j2.dx/d)*40;j2.dy=(j2.dy/d)*40}j2d.children[1].style.transform=`translate(${j2.dx}px,${j2.dy}px)`}});
c.addEventListener('mouseup',()=>{j1.a=false;j1.dx=0;j1.dy=0;j1d.children[1].style.transform='translate(0,0)';j2.a=false;j2.dx=0;j2.dy=0;j2d.children[1].style.transform='translate(0,0)'});

// --- ИГРОВАЯ ЛОГИКА ---
function startGame(n){cg=n;m.style.display='none';ex.style.display='flex';j1d.style.display='block';st1.style.display='block';if(gMode===2){j2d.style.display='block';st2.style.display='block'}else{j2d.style.display='none';st2.style.display='none'}t=0;p1.x=W/2-50;p1.y=H/2;p2.x=W/2+50;p2.y=H/2;mb.classList.remove('s');mb.style.display='none';p1.score=0;p2.score=0;p1.carry=null;p2.carry=null;p1.mt=0;p2.mt=0;p1.honey=0;p2.honey=0;
if(!mOn)toggleMusic();checkOrient();
if(n===1)sp("Строй дом!");if(n===2)sp("Беги!");if(n===3){sp("Прятки!");hg={l:false};ht=0;bx=[];for(let i=0;i<5;i++)bx.push({x:100+Math.random()*(W-200),y:200+Math.random()*(H-400)})}if(n===4)sp("Лечи животных!");if(n===5)sp("Лови еду!");if(n===6){sp("Ресторан! Подойди к телефону.");od=[];dv=[];ph={x:W/2,y:100};tables=[];for(let i=0;i<3;i++)tables.push({x:150+i*(W/3),y:H-200,want:null,timer:0})}if(n===7){sp("Пей колу лови ботов!");bt=[];cp=[];for(let i=0;i<5;i++)cp.push({x:Math.random()*W,y:Math.random()*H})}if(n===8){sp("Собери мед и обустрой берлогу!");cn=[];home={x:W/2,y:H-150,level:0}}}
function exitGame(){cg=null;m.style.display='flex';ex.style.display='none';j1d.style.display='none';j2d.style.display='none';st1.style.display='none';st2.style.display='none';mb.classList.remove('s');mb.style.display='none';rotHint.style.display='none';speechSynthesis.cancel();if(mOn)toggleMusic()}
function showMsg(v){mt.innerHTML=v;mb.style.display='block';setTimeout(()=>mb.classList.add('s'),10);sp(v.replace(/<br>/g,' '));ex.style.display='none';j1d.style.display='none';j2d.style.display='none';st1.style.display='none';st2.style.display='none';cg=null;if(mOn)toggleMusic()}
function loop(){if(cg!==null){update();draw()}requestAnimationFrame(loop)}
function update(){t++;p1.vx=j1.dx/40*4;p1.vy=j1.dy/40*4;p2.vx=j2.dx/40*4;p2.vy=j2.dy/40*4;updP(p1);if(gMode===2)updP(p2);if(cg===1)u1();if(cg===2)u2();if(cg===3)u3();if(cg===4)u4();if(cg===5)u5();if(cg===6)u6();if(cg===7)u7();if(cg===8)u8();st1.innerText='P1: '+(cg===8?p1.honey:p1.score);st2.innerText='P2: '+(cg===8?p2.honey:p2.score)}
function updP(p){p.x+=p.vx;p.y+=p.vy;if(p.x<20)p.x=20;if(p.x>W-20)p.x=W-20;if(p.y<20)p.y=20;if(p.y>H-20)p.y=H-20;if(Math.abs(p.vx)>.1||Math.abs(p.vy)>.1)p.ls=(p.ls+.3)%(2*Math.PI);p.a=Math.atan2(p.vy,p.vx)}
function draw(){x.clearRect(0,0,W,H);if(cg===1)d1();if(cg===2)d2();if(cg===3)d3();if(cg===4)d4();if(cg===5)d5();if(cg===6)d6();if(cg===7)d7();if(cg===8)d8();if(gMode===2)drawP(p2,'#3498db');drawP(p1,'#e74c3c')}
function drawP(p,col){x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.ellipse(p.x,p.y+25,20,8,0,0,2*Math.PI);x.fill();x.save();x.translate(p.x,p.y);if(p.vx!==0||p.vy!==0)x.rotate(p.a+Math.PI/2);x.fillStyle='#2c3e50';x.fillRect(-15,10,12,20+(Math.abs(p.vx)>.1?Math.sin(p.ls)*5:0));x.fillRect(3,10,12,20-(Math.abs(p.vx)>.1?Math.sin(p.ls)*5:0));x.fillStyle=p.mt>0?'#9b59b6':col;x.fillRect(-20,-15,40,35);x.fillStyle='rgba(0,0,0,.2)';x.fillRect(-20,10,40,10);x.fillStyle='#f1c27f';x.fillRect(-25,-10,5,15);x.fillRect(20,-10,5,15);x.fillStyle='#f1c27f';x.beginPath();x.arc(0,-25,18,0,2*Math.PI);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-6,-28,5,0,2*Math.PI);x.arc(6,-28,5,0,2*Math.PI);x.fill();x.fillStyle='#000';x.beginPath();x.arc(-6,-28,2,0,2*Math.PI);x.arc(6,-28,2,0,2*Math.PI);x.fill();x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.arc(0,-20,8,0,Math.PI);x.stroke();x.restore()}

let bl=[],mo=null;function u1(){if(t===1)sp("Строй стены!");if(t>600&&!mo){mo={x:-100,y:H/2};sp("Хагги идет!")}if(mo){let b=false;bl.forEach(r=>{if(mo.x>r.x-50&&mo.x<r.x+50&&mo.y>r.y-40&&mo.y<r.y+40){r.h--;b=true;if(r.h<=0)bl.splice(bl.indexOf(r),1)}});if(!b)mo.x+=1.5;if(mo.x>W+100)showMsg('🎉 Победа!');if(Math.hypot(mo.x-p1.x,mo.y-p1.y)<60||(gMode===2&&Math.hypot(mo.x-p2.x,mo.y-p2.y)<60))showMsg('💀 Хагги съел вас!')}if(j1.a&&t%10===0)bl.push({x:p1.x,y:p1.y,h:3});if(gMode===2&&j2.a&&t%10===0)bl.push({x:p2.x,y:p2.y,h:3})}
function d1(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87CEEB');g.addColorStop(.7,'#2ecc71');g.addColorStop(1,'#27ae60');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff';x.beginPath();x.arc(W*.2,100,30,0,2*Math.PI);x.arc(W*.2+30,100,40,0,2*Math.PI);x.arc(W*.2+60,100,30,0,2*Math.PI);x.fill();bl.forEach(r=>{x.fillStyle='rgba(0,0,0,.2)';x.fillRect(r.x-18,r.y-13,40,30);x.fillStyle='#e67e22';x.fillRect(r.x-20,r.y-15,40,30);x.strokeStyle='#d35400';x.lineWidth=2;x.strokeRect(r.x-20,r.y-15,40,30)});if(mo){x.fillStyle='#2a36b1';x.fillRect(mo.x-40,mo.y-60,80,120);x.fillStyle='#fff';x.beginPath();x.arc(mo.x-20,mo.y-40,15,0,2*Math.PI);x.arc(mo.x+20,mo.y-40,15,0,2*Math.PI);x.fill();x.fillStyle='#000';x.beginPath();x.arc(mo.x-20,mo.y-40,6,0,2*Math.PI);x.arc(mo.x+20,mo.y-40,6,0,2*Math.PI);x.fill();x.fillStyle='#d50000';x.beginPath();x.moveTo(mo.x-30,mo.y);x.quadraticCurveTo(mo.x,mo.y+40,mo.x+30,mo.y);x.quadraticCurveTo(mo.x,mo.y+20,mo.x-30,mo.y);x.fill()}}
let ch={x:100,y:0};function u2(){if(t===1)sp("Беги!");let ax=(p1.x+p2.x)/2,ay=(p1.y+p2.y)/2;if(gMode===1){ax=p1.x;ay=p1.y}ch.x+=(ax-ch.x)*.01;ch.y+=(ay-ch.y)*.01;if(t>3600)showMsg('🎉 Убежали!');if(Math.hypot(ch.x-p1.x,ch.y-p1.y)<50||(gMode===2&&Math.hypot(ch.x-p2.x,ch.y-p2.y)<50))showMsg('💀 Поймали!')}
function d2(){x.fillStyle='#2c3e50';x.fillRect(0,0,W,H);x.strokeStyle='#f1c40f';x.lineWidth=5;x.setLineDash([30,20]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(ch.x,ch.y+30,30,10,0,0,2*Math.PI);x.fill();x.font='60px Arial';x.textAlign='center';x.fillText('👻',ch.x,ch.y)}
let hg={l:false},ht=0,bx=[];function u3(){if(p1.y<100||(gMode===2&&p2.y<100)){showMsg('🎉 Сбежали!');return}ht++;if(ht>150){hg.l=!hg.l;ht=0;sp(hg.l?"Прячьтесь!":"Идите!")}if(hg.l){let h1=false,h2=gMode!==2;for(let b of bx){if(Math.hypot(b.x-p1.x,b.y-p1.y)<60)h1=true;if(gMode===2&&Math.hypot(b.x-p2.x,b.y-p2.y)<60)h2=true}if(!h1||(gMode===2&&!h2))showMsg('💀 Заметили!')}}

let ph={},od=[],dv=[],tables=[],fT=['🍕','🍔','🌮','🍩','🍟'];
function u6(){
    if(t===1)sp("Подойди к телефону!");
    // Спавн посетителей
    if(t%200===0&&tables.length<3)tables.push({x:100+Math.random()*(W-200),y:H-150,want:fT[Math.floor(Math.random()*5)],timer:0});
    
    // Заказ еды
    if(Math.hypot(p1.x-ph.x,p1.y-ph.y)<50&&t%100===0){
        let f=fT[Math.floor(Math.random()*5)];
        dv.push({x:-50,y:100,type:f});
        sp("Заказ готов!");
    }
    
    // Взять еду у курьера
    dv.forEach(d=>{
        d.x+=2;
        if(Math.hypot(p1.x-d.x,p1.y-d.y)<50){p1.carry=d.type;dv.splice(dv.indexOf(d),1);sp("Взял еду!")}
        if(gMode===2&&Math.hypot(p2.x-d.x,p2.y-d.y)<50){p2.carry=d.type;dv.splice(dv.indexOf(d),1);sp("Взял еду!")}
    });
    
    // Отдать еду посетителю
    tables.forEach(tb=>{
        tb.timer++;
        if(p1.carry&&Math.hypot(p1.x-tb.x,p1.y-tb.y)<50&&p1.carry===tb.want){
            p1.carry=null;p1.score++;tb.want=null;
            setTimeout(()=>{let i=tables.indexOf(tb);if(i>-1)tables.splice(i,1)},1000);
            sp("Приятного аппетита!");
        }
        if(gMode===2&&p2.carry&&Math.hypot(p2.x-tb.x,p2.y-tb.y)<50&&p2.carry===tb.want){
            p2.carry=null;p2.score++;tb.want=null;
            setTimeout(()=>{let i=tables.indexOf(tb);if(i>-1)tables.splice(i,1)},1000);
            sp("Приятного аппетита!");
        }
    });
}

}
